<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="title desc">
<title id="title">One state family, three measurement settings</title>
<desc id="desc">Five phases have the same Z-plus probability 9/25. X and Y measurements distinguish them. Exact fractions label every bar.</desc>
<rect width="780" height="510" fill="#faf8f2"/>
<g font-family="sans-serif" fill="#173b32"><text x="30" y="34" font-size="23">Relative phase changes the observable probabilities</text>
<text x="30" y="62" font-size="15">State: (3/5, 4z/5). Each labelled bar shows an exact plus probability.</text>
<text x="30" y="120" font-size="16">z = 1</text>
<rect x="170" y="102" width="137.200" height="22" fill="#245f50"/>
<text x="170" y="145" font-size="14">X+: 49/50</text>
<rect x="370" y="102" width="70.000" height="22" fill="#95632a"/>
<text x="370" y="145" font-size="14">Y+: 1/2</text>
<rect x="570" y="102" width="50.400" height="22" fill="#536caa"/>
<text x="570" y="145" font-size="14">Z+: 9/25</text>
<text x="30" y="197" font-size="16">z = i</text>
<rect x="170" y="179" width="70.000" height="22" fill="#245f50"/>
<text x="170" y="222" font-size="14">X+: 1/2</text>
<rect x="370" y="179" width="137.200" height="22" fill="#95632a"/>
<text x="370" y="222" font-size="14">Y+: 49/50</text>
<rect x="570" y="179" width="50.400" height="22" fill="#536caa"/>
<text x="570" y="222" font-size="14">Z+: 9/25</text>
<text x="30" y="274" font-size="16">z = -1</text>
<rect x="170" y="256" width="2.800" height="22" fill="#245f50"/>
<text x="170" y="299" font-size="14">X+: 1/50</text>
<rect x="370" y="256" width="70.000" height="22" fill="#95632a"/>
<text x="370" y="299" font-size="14">Y+: 1/2</text>
<rect x="570" y="256" width="50.400" height="22" fill="#536caa"/>
<text x="570" y="299" font-size="14">Z+: 9/25</text>
<text x="30" y="351" font-size="16">z = -i</text>
<rect x="170" y="333" width="70.000" height="22" fill="#245f50"/>
<text x="170" y="376" font-size="14">X+: 1/2</text>
<rect x="370" y="333" width="2.800" height="22" fill="#95632a"/>
<text x="370" y="376" font-size="14">Y+: 1/50</text>
<rect x="570" y="333" width="50.400" height="22" fill="#536caa"/>
<text x="570" y="376" font-size="14">Z+: 9/25</text>
<text x="30" y="428" font-size="16">z = (3+4i)/5</text>
<rect x="170" y="410" width="110.320" height="22" fill="#245f50"/>
<text x="170" y="453" font-size="14">X+: 197/250</text>
<rect x="370" y="410" width="123.760" height="22" fill="#95632a"/>
<text x="370" y="453" font-size="14">Y+: 221/250</text>
<rect x="570" y="410" width="50.400" height="22" fill="#536caa"/>
<text x="570" y="453" font-size="14">Z+: 9/25</text>
</g></svg>

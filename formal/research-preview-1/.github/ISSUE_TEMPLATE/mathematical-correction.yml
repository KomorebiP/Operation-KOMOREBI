name: Mathematical correction
description: Report a precise statement, hypothesis, or proof discrepancy.
title: '[Mathematics] '
labels: []
body:
  - type: markdown
    attributes:
      value: 'Identify the smallest affected claim. Do not include personal or confidential material.'
  - type: input
    id: claim
    attributes:
      label: Claim or Lean declaration
      description: Use CLAIMS.md or the exact module and declaration name.
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: Exact discrepancy
      description: State the hypotheses, claimed conclusion, and failing implication or counterexample.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction or mathematical argument
      description: Give a small argument or exact commands, input, version, and diagnostic.
    validations:
      required: true

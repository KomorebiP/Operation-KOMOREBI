name: Research question
description: Discuss a future direction without treating it as a result of this release.
title: '[Research] '
body:
  - type: markdown
    attributes:
      value: 'The Future Research section is separate from the release claims and release gates.'
  - type: textarea
    id: question
    attributes:
      label: Precise question and connection to the current development
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: What additional result would be needed?
      description: Distinguish known input, conjecture, experiment, and proposed theorem.
    validations:
      required: true

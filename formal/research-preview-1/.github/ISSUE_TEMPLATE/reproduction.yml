name: Reproduction failure
description: Report an artifact check, reference computation, or pinned Lean replay failure.
title: '[Reproduction] '
body:
  - type: dropdown
    id: route
    attributes:
      label: Route
      options:
        - Artifact identity or documentation check
        - Python reference demonstration
        - Exact reference audit
        - Public Lean bootstrap
        - Lean proof or axiom replay
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and exact command
      description: Include commit, OS, Python or Lean version, and the command. Remove tokens and private paths.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed result
      description: Include exit code and the smallest relevant diagnostic. Classify timeouts separately.
    validations:
      required: true

name: Artifact checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  artifact-integrity:
    name: Artifact integrity (not a Lean proof run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check sealed source, evidence, GitHub policy, and links
        run: python -B tools/check_github_ready.py
      - name: Test preparation safeguards
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test proof-diagnostic classifier (does not run Lean)
        run: python -B tools/replay_lean.py --self-test
  python-reference:
    name: Python reference (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run independent finite coefficient comparisons
        run: python -B demo.py --count 256

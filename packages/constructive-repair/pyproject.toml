[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-constructive-repair"
version = "1.0.0rc3"
description = "Exact rational constructive repair with separately checked Lean certificates"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Komorebi P."}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics"
]

[project.scripts]
komorebi-repair = "komorebi_repair.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["repair_certificates", "rational_menu", "branch_menu"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["komorebi_repair*"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-am-spd"
version = "1.0.0"
description = "Adaptive Multiscale Singular Packet Decomposition for finite image reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Komorebi P."}]
keywords = [
  "image reconstruction",
  "packet decomposition",
  "singular value decomposition",
  "multiscale methods",
  "computational imaging",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "scikit-image>=0.24,<1",
  "opencv-python-headless>=4.10,<6",
  "pillow>=10.4,<13",
]

[project.urls]
Repository = "https://github.com/KomorebiP/Operation-KOMOREBI"
Documentation = "https://github.com/KomorebiP/Operation-KOMOREBI/tree/main/packages/komorebi-am-spd/docs"
Issues = "https://github.com/KomorebiP/Operation-KOMOREBI/issues"

[project.optional-dependencies]
research = ["pandas>=2.2"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
am-spd = "am_spd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
am_spd = ["py.typed", "resources/*.csv", "resources/*.json", "resources/*.npz"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: computational integration test",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["research/original", "src/am_spd/_paper_v03"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

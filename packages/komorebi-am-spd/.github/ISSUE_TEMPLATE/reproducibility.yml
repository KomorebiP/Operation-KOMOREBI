name: Reproducibility report
description: Report a verification or manuscript rebuild discrepancy
title: "[Reproducibility] "
labels: [reproducibility]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - Package tests
        - Core packet verification
        - Singular packet verification
        - Intermediate AM-SPD verification
        - Final 12,154-scenario verification
        - Benchmark regeneration
        - LaTeX manuscript rebuild
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and dependency versions
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: Observed discrepancy
    validations:
      required: true

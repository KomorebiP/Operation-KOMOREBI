name: Build AM-SPD distribution

on:
  push:
    tags: ["am-spd-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: packages/komorebi-am-spd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/komorebi-am-spd/pyproject.toml
      - name: Install build tooling
        run: python -m pip install build
      - name: Build
        run: python -m build
      - name: Test wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/am-spd-wheel-test"
          "$RUNNER_TEMP/am-spd-wheel-test/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/am-spd-wheel-test/bin/python" -m am_spd info
          "$RUNNER_TEMP/am-spd-wheel-test/bin/python" -m am_spd verify --full
          "$RUNNER_TEMP/am-spd-wheel-test/bin/python" -m am_spd reproduce-paper --cases synthetic_geometry --output-dir "$RUNNER_TEMP/am-spd-wheel-replay" --strict-reference
      - name: Test source distribution independently
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/am-spd-sdist-test"
          "$RUNNER_TEMP/am-spd-sdist-test/bin/python" -m pip install dist/*.tar.gz pytest
          python - <<'PY'
          import glob
          import os
          import tarfile
          from pathlib import Path
          destination = Path(os.environ["RUNNER_TEMP"]) / "am-spd-sdist-source"
          destination.mkdir()
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as archive:
              archive.extractall(destination, filter="data")
          PY
          for source_dir in "$RUNNER_TEMP/am-spd-sdist-source"/*; do
            cd "$source_dir"
            "$RUNNER_TEMP/am-spd-sdist-test/bin/python" -m pytest --import-mode=importlib
          done
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/am-spd-sdist-test/bin/python" -m am_spd verify --full
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: komorebi-am-spd-distributions
          path: packages/komorebi-am-spd/dist/*

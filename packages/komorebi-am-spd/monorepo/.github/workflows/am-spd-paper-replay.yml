name: AM-SPD paper replay

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Space-separated cases or 'all'"
        required: true
        default: "synthetic_geometry"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: packages/komorebi-am-spd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/komorebi-am-spd/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[research]"
      - name: Replay selected cases
        shell: bash
        env:
          REQUESTED_CASES: ${{ inputs.cases }}
        run: |
          if [[ "$REQUESTED_CASES" == "all" ]]; then
            python -m am_spd reproduce-paper --output-dir artifacts/paper-replay --strict-reference
          else
            read -ra CASES <<< "$REQUESTED_CASES"
            python -m am_spd reproduce-paper --output-dir artifacts/paper-replay --strict-reference --cases "${CASES[@]}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: am-spd-paper-replay
          path: packages/komorebi-am-spd/artifacts/paper-replay

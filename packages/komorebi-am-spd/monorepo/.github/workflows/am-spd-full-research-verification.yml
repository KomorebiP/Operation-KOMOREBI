name: AM-SPD full research verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: packages/komorebi-am-spd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/komorebi-am-spd/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,research]"
      - name: Preserved research source checksums
        working-directory: packages/komorebi-am-spd/research/original
        run: sha256sum -c SHA256SUMS.txt
      - name: Package and historical verification in a copied run tree
        run: bash scripts/verify_full.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: am-spd-research-verification
          path: packages/komorebi-am-spd/artifacts/verification

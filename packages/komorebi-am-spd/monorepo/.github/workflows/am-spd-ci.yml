name: AM-SPD CI

on:
  push:
    branches: [main]
    paths:
      - "packages/komorebi-am-spd/**"
      - ".github/workflows/am-spd-ci.yml"
  pull_request:
    paths:
      - "packages/komorebi-am-spd/**"
      - ".github/workflows/am-spd-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: packages/komorebi-am-spd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/komorebi-am-spd/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Lint public source and tests
        run: python -m ruff check src tests examples
      - name: Test
        run: python -m pytest
      - name: Full package verification
        run: python -m am_spd verify --full
      - name: Strict synthetic geometry replay on Python 3.13
        if: matrix.python == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          replay_root="$RUNNER_TEMP/am-spd-ci-paper-replay"
          if command -v cygpath >/dev/null 2>&1; then
            replay_root="$(cygpath -u "$RUNNER_TEMP")/am-spd-ci-paper-replay"
          fi
          mkdir -p "$replay_root"
          python -m am_spd reproduce-paper --cases synthetic_geometry --strict-reference --output-dir "$replay_root/output" 2>&1 | tee "$replay_root/replay.log"
      - name: Retain strict synthetic geometry replay evidence
        if: always() && matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: am-spd-ci-paper-replay-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/am-spd-ci-paper-replay/**
          if-no-files-found: ignore

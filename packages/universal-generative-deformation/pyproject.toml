[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-generative-deformation"
version = "1.1.0"
description = "Typed infinite perturbation forests, path quotients, branch completion, and certified family discovery"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Komorebi P."}]
dependencies = ["numpy>=2.0", "sympy>=1.13", "matplotlib>=3.8"]

[project.scripts]
generative-deformation = "generative_deformation.cli:main"

[tool.setuptools]
packages = ["generative_deformation"]

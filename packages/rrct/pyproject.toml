[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rrct-configurable-lab"
version = "0.60.0.dev1"
description = "Persistent fuzzy-to-J workspace RRCT offline research laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
training = ["torch>=2.2"]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
rrct-lab = "rrct_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

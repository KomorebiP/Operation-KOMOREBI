[run]
name = "persistent_fuzzy_j_workspace"
seed = 600101
output_root = "runs"
overwrite = true
save_rows = true
strict_feature_contract = true
fail_on_unused_setting = true
checkpoint_keep = 5

[runtime]
device = "cpu"
threads = 1

[experiment]
family = "persistent_fuzzy_j_workspace"

[features]
workspace = true
fuzzy_packets = true
dynamic_formation = true
cost_regularization = true
jacobian_workspace = true
moving_j_lens = true
sparse_cone = true
provenance = true
planner_binding = true
recurrence = true

[workspace]
temperature = 1.0
formation_cost = 0.12

[jspace]
residual_dimension = 32
frame_rank = 4
active_directions = 2
steps = 192
calibration_steps = 48
event_interval = 12
moving_rate = 0.20
gate_learning_rate = 0.08
readout_learning_rate = 0.05
ridge = 0.001
spectral_ratio = 0.0001
ignition_threshold = 0.12
access_hysteresis = 0.04
random_baselines = 8
checkpoint_interval = 24

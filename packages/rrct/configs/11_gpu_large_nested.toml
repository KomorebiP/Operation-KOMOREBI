[run]
name = "gpu_large_nested"
seed = 581101
output_root = "runs"
repetitions = 8
save_models = true

[experiment]
family = "nested_workspace"
calibration_episodes = 8192
holdout_episodes = 16384


[features]
workspace = true
hierarchical_workspace = true
top_down_broadcast = true
planner_binding = true
causal_patching = true
emergence_training = true
terminal_only = true

[workspace]
local_dimension = 8
global_dimension = 8
hierarchy_depth = 2

[training]
enabled = true
steps = 5000
batch_size = 2048
learning_rate = 0.001
hidden_width = 128

[runtime]
device = "cuda"
threads = 4
amp = false

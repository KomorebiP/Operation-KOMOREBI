[run]
name = "continuous_resume_smoke"
seed = 590213
output_root = "runs"
overwrite = true
save_rows = true
make_plots = false
strict_feature_contract = true
fail_on_unused_setting = true
checkpoint_keep = 4

[experiment]
family = "continuous_open_set_runtime"
agent_count = 4

[features]
fuzzy_packets = true
dynamic_formation = true
cost_regularization = true
continuous_event_fabric = true
open_set_change_detection = true
dynamic_packet_birth = true
dynamic_packet_death = true
self_model_repair = true
memory_quarantine = true

[workspace]
allow_new_packets = true
max_packets = 7
birth_threshold = 0.45
death_threshold = 0.10
formation_cost = 0.20

[continuous]
steps = 24
calibration_steps = 3
event_interval = 4
invocation_step_limit = 12
checkpoint_state_rows = 32
checkpoint_interval = 4


[run]
name = "nested_workspace_training"
seed = 580501
output_root = "runs"
save_models = true

[experiment]
family = "nested_workspace"
calibration_episodes = 4096
holdout_episodes = 8192

[features]
workspace = true
hierarchical_workspace = true
top_down_broadcast = true
planner_binding = true
causal_patching = true
emergence_training = true
terminal_only = true

[workspace]
local_dimension = 2
global_dimension = 2
hierarchy_depth = 2

[training]
enabled = true
steps = 1400
batch_size = 256
learning_rate = 0.003
hidden_width = 32

[runtime]
device = "auto"
threads = 1

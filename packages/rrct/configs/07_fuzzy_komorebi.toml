[run]
name = "fuzzy_komorebi"
seed = 580701
output_root = "runs"
save_models = true

[experiment]
family = "fuzzy_coalitions"
agent_count = 4
holdout_episodes = 4096
noise_std = 0.04

[features]
workspace = true
fuzzy_packets = true
dynamic_formation = true
cost_regularization = true
causal_patching = true

[workspace]
packet_count = 4
shared_packet_count = 3
temperature = 1.0
entropy_penalty = 0.0
idempotence_penalty = 0.0

[training]
enabled = true
steps = 2000
batch_size = 256
learning_rate = 0.003
hidden_width = 48

[runtime]
device = "auto"
threads = 1

[run]
name = "continuous_open_set_runtime"
seed = 590201
output_root = "runs"
save_rows = true
make_plots = true
strict_feature_contract = true
fail_on_unused_setting = true
checkpoint_keep = 5

[runtime]
device = "cpu"
threads = 1
timeout_seconds = 0
memory_limit_mb = 0

[experiment]
family = "continuous_open_set_runtime"
observation_dim = 12
agent_count = 6
noise_std = 0.02

[features]
workspace = true
self_model = true
causal_boundary = true
temporal_identity = true
transformational_continuity = true
autobiographical_memory = true
provenance = true
planner_binding = true
recurrence = true
metacognition = true
uncertainty = true
adaptive_probing = true
abstention = true
fuzzy_packets = true
dynamic_formation = true
cost_regularization = true
receipt_chain = true
continuous_event_fabric = true
open_set_change_detection = true
dynamic_packet_birth = true
dynamic_packet_death = true
self_model_repair = true
memory_quarantine = true

[workspace]
packet_count = 4
max_packets = 10
allow_new_packets = true
allow_packet_death = true
temperature = 0.8
formation_cost = 0.22
birth_threshold = 0.55
death_threshold = 0.08
min_packet_lifetime = 6

[continuous]
steps = 2048
calibration_steps = 24
event_interval = 16
change_threshold = 0.16
recovery_threshold = 0.10
repair_rate = 0.8
packet_update_rate = 0.35
probe_samples = 4
task_switch_interval = 9
checkpoint_interval = 64


[memory]
capacity = 512
write_threshold = 0.7
quarantine_threshold = 0.4

[metacognition]
evidence_budget = 1
max_evidence_budget = 5
uncertainty_threshold = 0.35

[planner]
uncertainty_weight = 0.2

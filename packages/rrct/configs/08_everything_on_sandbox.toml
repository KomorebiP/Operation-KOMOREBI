[run]
name = "continuous_open_set_everything_on"
seed = 590801
output_root = "runs"
resume = true
strict_feature_contract = true
fail_on_unused_setting = true

[experiment]
family = "continuous_open_set_runtime"
event_horizon = 4096
sequence_length = 12
agent_count = 6
action_dim = 4
noise_std = 0.03
world_shift_probability = 0.12
self_shift_probability = 0.12
memory_corruption_probability = 0.10
partner_change_probability = 0.08
no_workspace_probability = 0.25

[features]
workspace = true
self_model = true
causal_boundary = true
temporal_identity = true
transformational_continuity = true
autobiographical_memory = true
provenance = true
planner_binding = true
recurrence = true
metacognition = true
uncertainty = true
adaptive_probing = true
abstention = true
coordinate_alignment = true
fuzzy_packets = true
dynamic_formation = true
receipt_chain = true
continuous_event_fabric = true
open_set_change_detection = true
dynamic_packet_birth = true
dynamic_packet_death = true
self_model_repair = true
memory_quarantine = true

[workspace]
max_packets = 8
allow_new_packets = true
allow_packet_death = true
birth_threshold = 0.25
death_threshold = 0.15
membership_hysteresis = 0.10

[continuous]
checkpoint_interval = 64
anomaly_threshold = 0.20
attribution_margin = 0.10
probe_rounds = 2
packet_update_rate = 0.60
packet_decay_rate = 0.20
packet_birth_patience = 1
packet_death_patience = 2
repair_learning_rate = 0.40
max_memory_records = 1024

[runtime]
device = "cpu"
threads = 1
timeout_seconds = 0
memory_limit_mb = 0

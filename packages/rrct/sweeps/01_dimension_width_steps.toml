[run]
name = "dimension_width_steps"
seed = 582001
output_root = "runs/sweeps"
save_rows = false
make_plots = false

[experiment]
family = "nested_workspace"
calibration_episodes = 1024
holdout_episodes = 2048

[training]
enabled = true
batch_size = 256
learning_rate = 0.003

[sweep]
enabled = true
execute = true
parallel_workers = 1
max_runs = 0

[sweep.grid]
"workspace.local_dimension" = [1, 2, 4, 8]
"workspace.global_dimension" = [1, 2, 4, 8]
"training.hidden_width" = [16, 32, 64]
"training.steps" = [200, 400, 800, 1200]

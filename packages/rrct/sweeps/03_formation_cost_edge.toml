[run]
name = "formation_cost_edge"
seed = 582201
output_root = "runs/sweeps"
save_rows = false

[experiment]
family = "formation_routing"
episodes = 50000

[features]
dynamic_formation = true
cost_regularization = true
hierarchical_workspace = true

[sweep]
enabled = true
execute = true

[sweep.grid]
"workspace.formation_cost" = [0.0, 0.01, 0.03, 0.05, 0.08, 0.12, 0.16, 0.20, 0.22, 0.24, 0.26, 0.30, 0.40]
"workspace.temperature" = [0.02, 0.05, 0.10]

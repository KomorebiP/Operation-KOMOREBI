[run]
name = "continuous_open_set_ablation"
seed = 592501
output_root = "runs/sweeps"
save_rows = false
make_plots = false
strict_feature_contract = true
fail_on_unused_setting = true

[experiment]
family = "continuous_open_set_runtime"
event_horizon = 2048
sequence_length = 12
agent_count = 6
noise_std = 0.03

[features]
workspace = true
self_model = true
causal_boundary = true
temporal_identity = true
transformational_continuity = true
autobiographical_memory = true
provenance = true
planner_binding = true
recurrence = true
metacognition = true
uncertainty = true
adaptive_probing = true
coordinate_alignment = true
fuzzy_packets = true
dynamic_formation = true
continuous_event_fabric = true
open_set_change_detection = true
dynamic_packet_birth = true
dynamic_packet_death = true
self_model_repair = true
memory_quarantine = true

[workspace]
max_packets = 8
allow_new_packets = true
allow_packet_death = true
birth_threshold = 0.25

[continuous]
checkpoint_interval = 128
packet_update_rate = 0.60
packet_birth_patience = 1
packet_death_patience = 2

[sweep]
enabled = true
execute = true
parallel_workers = 4
resume = true
retry_failures = 1

[sweep.grid]
"interventions.change_detector_cut" = [false, true]
"interventions.self_world_attribution_cut" = [false, true]
"interventions.packet_birth_cut" = [false, true]
"interventions.provenance_cut" = [false, true]
"interventions.recurrence_cut" = [false, true]

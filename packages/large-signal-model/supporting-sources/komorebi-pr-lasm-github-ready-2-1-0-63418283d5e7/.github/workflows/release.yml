name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish tagged release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tools and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[test]"
      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Run core verification
        run: |
          python -m compileall -q src examples
          python -m pytest -q -m "not local_suite"
          python examples/exact_reconstruction.py
          python examples/adaptive_refinement.py
      - name: Build distributions
        run: python -m build
      - name: Create checksums
        shell: bash
        run: |
          cp paper/Projector_Resolved_Large_Algebraic_Signal_Model.pdf dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --generate-notes
          --title "PR-LASM ${GITHUB_REF_NAME}"

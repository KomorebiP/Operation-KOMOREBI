name: Bug report
description: Report a reproducible implementation or packaging defect
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Defect
      description: State what failed and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide commands, Python version, and a minimal synthetic task.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, NumPy, solver version, and source hash.

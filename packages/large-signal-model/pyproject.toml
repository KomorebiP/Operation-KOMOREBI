[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-pr-lasm"
version = "2.3.0"
description = "Projector-resolved large algebraic signal model with exact multi-atlas coordinates, typed Bayesian operator programs, and offline active planning."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Komorebi P."}]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "signal-processing",
  "wavelets",
  "polyphase",
  "bayesian-inference",
  "world-model",
  "active-planning",
  "exact-reconstruction",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
arc3 = [
  "arc-agi==0.9.9",
  "arcengine==0.9.3",
  "pillow>=12.1.1,<13",
  "requests>=2.31",
]
paper = ["matplotlib>=3.8,<4", "reportlab>=4,<5"]
test = [
  "pytest>=8,<10",
  "requests>=2.31",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "requests>=2.31",
  "setuptools>=77",
]

[project.scripts]
komorebi-pr-lasm = "komorebi_arc3_offline.lasm_cli:main"
komorebi-arc3-offline = "komorebi_arc3_offline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
komorebi_arc3_offline = ["py.typed"]
komorebi_pr_lasm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "local_suite: requires the separately distributed 25-environment ARC fixture archive",
]

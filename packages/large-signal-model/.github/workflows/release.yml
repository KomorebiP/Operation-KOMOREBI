name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_draft:
        description: "Create a GitHub draft after the license gate passes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]" "setuptools>=77"
      - name: Require a matching version tag
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: python scripts/check_repository.py
      - run: python -m pytest -q -W error -m "not local_suite"
      - run: komorebi-pr-lasm self-check
      - run: python scripts/build_offline.py --output dist
      - name: Add guide and checksums
        shell: bash
        run: |
          cp docs/RELEASE_GUIDE.pdf dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_draft
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/check_publication.py
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: Create a draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag --draft --generate-notes
          --title "PR-LASM ${GITHUB_REF_NAME}"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e ".[test]"
      - name: Verify source consistency
        run: python scripts/check_repository.py
      - name: Run core tests with warnings treated as errors
        run: python -m pytest -q -W error -m "not local_suite"
      - name: Run self check and worked examples
        run: |
          komorebi-pr-lasm self-check
          python examples/exact_reconstruction.py
          python examples/adaptive_refinement.py
          python examples/continuous_signal.py
          python examples/polyphase_taps.py
          python examples/streaming_signal.py
          python examples/signal_archive.py
          python examples/operator_identification.py
          python examples/euler_signal_bridge.py

  build:
    name: Build wheel and source distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "setuptools>=77" "numpy>=1.26,<3" "scipy>=1.11,<2"
      - run: python scripts/build_offline.py --output dist
      - name: Verify wheel outside source tree
        shell: bash
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-test" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/wheel-test" python -m komorebi_pr_lasm self-check
      - uses: actions/upload-artifact@v7
        with:
          name: komorebi-pr-lasm-distributions
          path: dist/*
          if-no-files-found: error

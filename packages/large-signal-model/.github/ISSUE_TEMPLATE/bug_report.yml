name: Bug report
description: Report a reproducible defect in the code, packaging, or documentation
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, inputs, and the smallest reproducible example.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PR-LASM version
      placeholder: 2.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12.6, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Data and security check
      options:
        - label: I removed credentials, private environment files, and sensitive data.
          required: true

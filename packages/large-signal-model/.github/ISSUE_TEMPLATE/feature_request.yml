name: Feature request
description: Propose a scoped extension to the mathematical or software architecture
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete limitation does the proposal address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Define inputs, outputs, invariants, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: State the tests, exact certificates, or benchmarks required.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Primary layer
      options:
        - Exact coordinate atlas
        - Packet refinement
        - Bayesian operator grammar
        - Memory or graph
        - Active planner
        - ARC integration
        - Packaging or documentation
    validations:
      required: true

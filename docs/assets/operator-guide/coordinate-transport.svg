<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title description">
  <title id="title">Coordinate transport as a commuting square</title>
  <desc id="description">The original operator T maps X to Y. Coordinate maps C_X and C_Y lead down to X prime and Y prime. The transported operator T prime maps between the new coordinate spaces, so either path from X to Y prime gives the same result.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#28523d"/></marker></defs>
  <rect width="900" height="300" rx="12" fill="#f5f7f3"/>
  <g fill="#fff" stroke="#7c9587" stroke-width="1.5">
    <rect x="45" y="30" width="245" height="70" rx="9"/>
    <rect x="610" y="30" width="245" height="70" rx="9"/>
    <rect x="45" y="200" width="245" height="70" rx="9"/>
    <rect x="610" y="200" width="245" height="70" rx="9"/>
  </g>
  <g stroke="#28523d" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M305 65H595"/>
    <path d="M305 235H595"/>
    <path d="M168 112V185"/>
    <path d="M733 112V185"/>
  </g>
  <g fill="#20382a" font-family="Georgia,serif" font-size="21" text-anchor="middle">
    <text x="168" y="61">Original input X</text><text x="168" y="85" font-family="Arial,sans-serif" font-size="14">objects before coordinate change</text>
    <text x="733" y="61">Original output Y</text><text x="733" y="85" font-family="Arial,sans-serif" font-size="14">the result of the operation</text>
    <text x="168" y="231">Input coordinates X′</text><text x="168" y="255" font-family="Arial,sans-serif" font-size="14">the same input in new coordinates</text>
    <text x="733" y="231">Output coordinates Y′</text><text x="733" y="255" font-family="Arial,sans-serif" font-size="14">the same output in new coordinates</text>
    <text x="450" y="49">T</text><text x="450" y="218">T′ = C_Y T C_X⁻¹</text>
    <text x="130" y="157">C_X</text><text x="774" y="157">C_Y</text>
    <text x="450" y="147" font-family="Arial,sans-serif" font-size="16">Both routes agree:</text><text x="450" y="175">T′ C_X = C_Y T</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="title desc">
  <title id="title">A one-inductor passive realization</title>
  <desc id="desc">The input passes through resistor R sub s, then reaches a resistor R sub p and an inductor L in parallel. Both branches return to the lower input terminal.</desc>
  <rect x="1" y="1" width="718" height="268" rx="14" fill="#fcfaf4" stroke="#cbd4c5" stroke-width="2"/>
  <text x="40" y="42" fill="#5b6f60" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">ONE-STATE LIMIT</text>
  <g fill="none" stroke="#28523d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="70" cy="100" r="5" fill="#fcfaf4"/>
    <circle cx="70" cy="218" r="5" fill="#fcfaf4"/>
    <path d="M75 100h52m116 0h62m0 0h240m-470 118h470M305 100v35m0 42v41m240-118v27m0 76v15"/>
    <path d="M127 100l10-14 17 28 17-28 17 28 17-28 17 28 11-14h10"/>
    <rect x="292" y="135" width="26" height="42" rx="3"/>
    <path d="M545 127a12 12 0 0 1 0 24a12 12 0 0 1 0 24a12 12 0 0 1 0 24v4"/>
    <circle cx="305" cy="100" r="4" fill="#28523d"/>
    <circle cx="545" cy="100" r="4" fill="#28523d"/>
    <circle cx="305" cy="218" r="4" fill="#28523d"/>
    <circle cx="545" cy="218" r="4" fill="#28523d"/>
  </g>
  <g fill="#263e33" font-family="Georgia, serif" font-size="28">
    <text x="22" y="160" font-style="italic">Z<tspan baseline-shift="sub" font-size="18">*</tspan></text>
    <text x="174" y="74" font-style="italic">R<tspan baseline-shift="sub" font-size="18">s</tspan></text>
    <text x="330" y="165" font-style="italic">R<tspan baseline-shift="sub" font-size="18">p</tspan></text>
    <text x="574" y="170" font-style="italic">L</text>
  </g>
</svg>

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rrct-workspace-emergence-edge"
version = "0.55.0.dev1"
description = "Parameter-matched workspace-emergence edge study"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2", "scipy>=1.10", "pandas>=2", "scikit-learn>=1.3", "matplotlib>=3.7"]

[tool.setuptools]
py-modules = ["workspace_edge"]
package-dir = {"" = "src"}

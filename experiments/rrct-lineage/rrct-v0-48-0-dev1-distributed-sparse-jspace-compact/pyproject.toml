[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rrct-prototype"
version = "0.48.0.dev1"
description = "Nonvalenced causal architecture prototype for Recursive Resolution Closure Theory"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Komorebi P."}]
dependencies = ["numpy>=1.24,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[project.scripts]
rrct = "rrct.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rrct = ["_vendor/*.whl", "_vendor/*.md", "_vendor/*.json"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sric-real-lrm-pilot"
version = "0.1.0"
description = "Sealed causal audit infrastructure for external latent reasoning models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]
real = [
  "torch==2.5.1",
  "transformers==4.46.2",
  "datasets>=2.18.0",
  "accelerate>=0.27.0",
  "peft==0.15.2",
  "safetensors>=0.4.0",
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
  "requests>=2.28.0",
  "tqdm>=4.65.0",
  "PyYAML>=6.0",
  "wandb>=0.16.0",
  "huggingface_hub>=0.25.0"
]

[tool.setuptools.packages.find]
include = ["sric_real_lrm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

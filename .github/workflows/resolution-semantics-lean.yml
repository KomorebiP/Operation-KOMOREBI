name: Resolution Semantics Lean companion
on:
  push:
    branches: [main]
    paths:
      - 'formal/resolution-semantics-v0.2.0/**'
      - 'formal/resolution-semantics-v0.3.0/**'
      - 'research/resolution-semantics/formal/KRS_Core.lean'
      - '.github/workflows/resolution-semantics-lean.yml'
  pull_request:
    paths:
      - 'formal/resolution-semantics-v0.2.0/**'
      - 'formal/resolution-semantics-v0.3.0/**'
      - 'research/resolution-semantics/formal/KRS_Core.lean'
      - '.github/workflows/resolution-semantics-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        version: ['0.2.0', '0.3.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: formal/resolution-semantics-v${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            formal/resolution-semantics-v${{ matrix.version }}
            research/resolution-semantics
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: formal/resolution-semantics-v${{ matrix.version }}
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
          check-reservoir-eligibility: 'false'
          leanchecker: 'false'
          nanoda: 'false'
          axiom-audit: 'false'
      - name: Expose Elan shims to Windows run steps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # lean-action adds an MSYS path; PowerShell needs the native path.
          $elanBin = Join-Path $env:USERPROFILE '.elan\bin'
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $elanBin -Encoding utf8
      - name: Build the pinned companion
        run: lake build
      - name: Fresh proof objects, axiom inventories and rejection controls
        run: python replay.py --lean lean --output "${{ runner.temp }}/resolution-semantics-proof"
      - name: Retain the exact replay and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: resolution-semantics-${{ matrix.version }}-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/resolution-semantics-proof/
          if-no-files-found: warn
          retention-days: 30

name: Collection and formal artifact checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate collection and preserved formal artifact
        run: python -B tools/check_repository.py
      - name: Verify every source receipt against the committed tree
        run: python -B tools/check_source_receipts.py
      - name: Check all maintained navigation and status pages
        run: python -B tools/update_completion_status.py --check
      - name: Test receipt and navigation regressions
        run: python -B -m unittest discover -s tools -p 'test_*.py' -v
      - name: Install pinned NumPy for bounded SRIC qualification
        run: python -m pip install numpy==2.3.5
      - name: Test corrected SRIC admission boundaries and fixture CLI
        run: python -B packages/sric-admission-v0.3.3/tests/test_admission_boundaries.py
      - name: Test formal receipt and upload guards
        working-directory: formal/research-preview-1
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test formal diagnostic classifier
        working-directory: formal/research-preview-1
        run: python -B tools/replay_lean.py --self-test

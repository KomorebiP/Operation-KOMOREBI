name: AM-SPD stable release

on:
  workflow_run:
    workflows: ["AM-SPD CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      main_sha:
        description: "Optional exact current main SHA; successful AM-SPD CI is required."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: am-spd-stable-release-1.0.0
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      ci_run_id: ${{ steps.select.outputs.ci_run_id }}
    steps:
      - name: Require successful CI for the exact current main commit
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          REQUESTED_MAIN_SHA: ${{ github.event.inputs.main_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repository = os.environ["GH_REPO"]
          def api(endpoint):
              return json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))

          main_sha = api(f"repos/{repository}/branches/main")["commit"]["sha"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          workflow = api(f"repos/{repository}/actions/workflows/am-spd-ci.yml")
          if workflow["path"] != ".github/workflows/am-spd-ci.yml" or workflow["name"] != "AM-SPD CI":
              raise SystemExit("Unexpected CI workflow identity")
          if os.environ["EVENT_NAME"] == "workflow_run":
              run = event["workflow_run"]
              if (run["conclusion"] != "success" or run["status"] != "completed"
                      or run["head_branch"] != "main"
                      or run["head_repository"]["full_name"].lower() != repository.lower()
                      or run["workflow_id"] != workflow["id"]
                      or run["event"] not in ("push", "workflow_dispatch")):
                  raise SystemExit("Release requires successful main CI from this repository")
              selected_sha = run["head_sha"]
              selected_run_id = run["id"]
          else:
              if os.environ["CURRENT_REF"] != "refs/heads/main":
                  raise SystemExit("Dispatch this workflow from main")
              selected_sha = os.environ.get("REQUESTED_MAIN_SHA", "").strip() or main_sha
              selected_run_id = None
          if not re.fullmatch(r"[0-9a-f]{40}", selected_sha) or selected_sha != main_sha:
              raise SystemExit("The selected commit must still be the exact current main SHA")
          runs = api(
              f"repos/{repository}/actions/workflows/{workflow['id']}/runs"
              f"?head_sha={selected_sha}&branch=main&status=success&per_page=100"
          )["workflow_runs"]
          qualifying = [
              run for run in runs
              if run["head_sha"] == selected_sha and run["head_branch"] == "main"
              and run["status"] == "completed" and run["conclusion"] == "success"
              and run["head_repository"]["full_name"].lower() == repository.lower()
              and run["workflow_id"] == workflow["id"]
              and run["event"] in ("push", "workflow_dispatch")
          ]
          if selected_run_id is not None:
              qualifying = [run for run in qualifying if run["id"] == selected_run_id]
          if not qualifying:
              raise SystemExit("No successful CI run qualifies for the selected main commit")
          selected_run_id = qualifying[0]["id"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"sha={selected_sha}\nci_run_id={selected_run_id}\n")
          print(f"Qualified main {selected_sha} with CI run {selected_run_id}")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Require the exact stable version and release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import tomllib
          from pathlib import Path
          package = Path("packages/komorebi-am-spd")
          with (package / "pyproject.toml").open("rb") as source:
              project = tomllib.load(source)["project"]
          if project["name"] != "komorebi-am-spd" or project["version"] != "1.0.0":
              raise SystemExit("This workflow releases only komorebi-am-spd 1.0.0")
          if not (package / "RELEASE_NOTES_v1.0.0.md").is_file():
              raise SystemExit("The versioned release notes are required")
          PY

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      distributions: ${{ steps.distributions.outputs['artifact-id'] }}
      windows_bundle: ${{ steps.windows_bundle.outputs['artifact-id'] }}
    defaults:
      run:
        working-directory: packages/komorebi-am-spd
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/komorebi-am-spd/requirements-release-lock.txt
      - name: Build the wheel and source distribution
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build
          python - <<'PY'
          from pathlib import Path
          wheels = list(Path("dist").glob("komorebi_am_spd-1.0.0-*.whl"))
          sources = list(Path("dist").glob("komorebi_am_spd-1.0.0.tar.gz"))
          if len(wheels) != 1 or len(sources) != 1 or len(list(Path("dist").iterdir())) != 2:
              raise SystemExit("Expected exactly one 1.0.0 wheel and one source distribution")
          PY
      - name: Verify the installed wheel outside the checkout
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python -m venv "$RUNNER_TEMP/am-spd-release-wheel"
          runtime="$RUNNER_TEMP/am-spd-release-wheel/bin/python"
          "$runtime" -m pip install --constraint requirements-release-lock.txt dist/*.whl
          cd "$RUNNER_TEMP"
          "$runtime" - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path
          import am_spd
          assert version("komorebi-am-spd") == "1.0.0"
          assert not Path(am_spd.__file__).resolve().is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve())
          PY
          "$runtime" -m am_spd info 2>"$RUNNER_TEMP/am-spd-release-wheel-info.stderr.log" | tee "$RUNNER_TEMP/am-spd-release-wheel-info.json"
          "$runtime" -m am_spd verify --full 2>"$RUNNER_TEMP/am-spd-release-wheel-verification.stderr.log" | tee "$RUNNER_TEMP/am-spd-release-wheel-verification.json"
          "$runtime" -m am_spd reproduce-paper --strict-reference --output-dir "$RUNNER_TEMP/am-spd-release-wheel-replay" 2>&1 | tee "$RUNNER_TEMP/am-spd-release-wheel-replay.log"
      - name: Qualify the source distribution independently with all 240 tests
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python -m venv "$RUNNER_TEMP/am-spd-release-sdist"
          runtime="$RUNNER_TEMP/am-spd-release-sdist/bin/python"
          "$runtime" -m pip install --constraint requirements-release-lock.txt dist/*.tar.gz pytest
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path
          destination = Path(os.environ["RUNNER_TEMP"]) / "am-spd-release-sdist-source"
          destination.mkdir()
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              archive.extractall(destination, filter="data")
          PY
          source_dir="$RUNNER_TEMP/am-spd-release-sdist-source/komorebi_am_spd-1.0.0"
          cd "$source_dir"
          "$runtime" -m pytest --import-mode=importlib --junitxml="$RUNNER_TEMP/am-spd-release-sdist-tests.xml" 2>&1 | tee "$RUNNER_TEMP/am-spd-release-sdist-tests.log"
          "$runtime" - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "am-spd-release-sdist-tests.xml")
          suites = list(report.getroot().iter("testsuite"))
          assert sum(int(suite.attrib["tests"]) for suite in suites) == 240, "Expected the audited 240-test suite"
          assert all(int(suite.attrib.get(key, 0)) == 0 for suite in suites for key in ("errors", "failures", "skipped"))
          PY
          cd "$RUNNER_TEMP"
          "$runtime" -m am_spd verify --full 2>"$RUNNER_TEMP/am-spd-release-sdist-verification.stderr.log" | tee "$RUNNER_TEMP/am-spd-release-sdist-verification.json"
      - name: Prepare the locked Windows CPython 3.13 offline bundle
        env:
          TESTED_MAIN_SHA: ${{ needs.gate.outputs.sha }}
          TESTED_CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/am-spd-offline/komorebi-am-spd-1.0.0-windows-cp313"
          python scripts/prepare_offline.py             --wheel dist/komorebi_am_spd-1.0.0-py3-none-any.whl             --output "$bundle/wheelhouse"             --platform win_amd64 --python-version 3.13 --abi cp313             --lock requirements-release-lock.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path
          parent = Path(os.environ["RUNNER_TEMP"]) / "am-spd-offline"
          bundle = parent / "komorebi-am-spd-1.0.0-windows-cp313"
          (bundle / "scripts").mkdir()
          for name in ("requirements-release-lock.txt", "INSTALL_OFFLINE.md", "LICENSE", "RELEASE_NOTES_v1.0.0.md"):
              shutil.copy2(name, bundle / name)
          shutil.copy2("scripts/install_offline.ps1", bundle / "scripts/install_offline.ps1")
          wheels = sorted((bundle / "wheelhouse").glob("*.whl"))
          if not wheels or any(path.suffix != ".whl" for path in (bundle / "wheelhouse").iterdir()):
              raise SystemExit("The offline bundle must contain binary wheels only")
          receipt = {
              "package": "komorebi-am-spd", "version": "1.0.0",
              "tested_main_sha": os.environ["TESTED_MAIN_SHA"],
              "successful_ci_run_id": os.environ["TESTED_CI_RUN_ID"],
              "platform": "win_amd64", "python": "CPython 3.13", "abi": "cp313",
              "release_lock_sha256": hashlib.sha256((bundle / "requirements-release-lock.txt").read_bytes()).hexdigest(),
              "wheels": {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in wheels},
              "qualification": "Native Windows offline installation is a required subsequent workflow job.",
          }
          (bundle / "PROVENANCE.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          shutil.make_archive(str(parent / bundle.name), "zip", root_dir=parent, base_dir=bundle.name)
          PY
      - name: Retain the tested wheel and source distribution
        id: distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: am-spd-release-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/komorebi-am-spd/dist/*
          if-no-files-found: error
      - name: Retain the Windows offline ZIP
        id: windows_bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: am-spd-windows-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/am-spd-offline/komorebi-am-spd-1.0.0-windows-cp313.zip
          if-no-files-found: error
      - name: Retain wheel verification and complete replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: am-spd-release-wheel-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/am-spd-release-wheel-info.json
            ${{ runner.temp }}/am-spd-release-wheel-info.stderr.log
            ${{ runner.temp }}/am-spd-release-wheel-verification.json
            ${{ runner.temp }}/am-spd-release-wheel-verification.stderr.log
            ${{ runner.temp }}/am-spd-release-wheel-replay.log
            ${{ runner.temp }}/am-spd-release-wheel-replay/**
          if-no-files-found: ignore
      - name: Retain source-distribution test and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: am-spd-release-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/am-spd-release-sdist-tests.xml
            ${{ runner.temp }}/am-spd-release-sdist-tests.log
            ${{ runner.temp }}/am-spd-release-sdist-verification.json
            ${{ runner.temp }}/am-spd-release-sdist-verification.stderr.log
          if-no-files-found: ignore

  windows_offline:
    needs: [gate, build]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download this run's exact Windows bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.windows_bundle }}
          path: ${{ runner.temp }}/am-spd-offline-download
          merge-multiple: true
      - name: Install and verify the bundle natively without a package index
        shell: pwsh
        env:
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          TESTED_MAIN_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $Archive = Join-Path $env:RUNNER_TEMP "am-spd-offline-download/komorebi-am-spd-1.0.0-windows-cp313.zip"
          $Destination = Join-Path $env:RUNNER_TEMP "am-spd-native-windows"
          Expand-Archive -LiteralPath $Archive -DestinationPath $Destination
          $Bundle = Join-Path $Destination "komorebi-am-spd-1.0.0-windows-cp313"
          $Environment = Join-Path $env:RUNNER_TEMP "am-spd-native-windows-venv"
          $Receipt = Get-Content (Join-Path $Bundle "PROVENANCE.json") -Raw | ConvertFrom-Json
          if ($Receipt.tested_main_sha -ne $env:TESTED_MAIN_SHA) { throw "The bundle commit differs from the qualified main commit" }
          $LockHash = (Get-FileHash (Join-Path $Bundle "requirements-release-lock.txt") -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($LockHash -ne $Receipt.release_lock_sha256) { throw "Release-lock checksum mismatch" }
          foreach ($Wheel in $Receipt.wheels.PSObject.Properties) {
              $Actual = (Get-FileHash (Join-Path $Bundle ("wheelhouse/" + $Wheel.Name)) -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($Actual -ne $Wheel.Value) { throw "Wheel checksum mismatch: $($Wheel.Name)" }
          }
          Push-Location $env:RUNNER_TEMP
          try {
              & (Join-Path $Bundle "scripts/install_offline.ps1") -Wheelhouse (Join-Path $Bundle "wheelhouse") -Environment $Environment -PythonVersion "3.13"
              $Python = Join-Path $Environment "Scripts/python.exe"
              & $Python -c "import sys; from importlib.metadata import version; assert sys.version_info[:2] == (3, 13); assert version('komorebi-am-spd') == '1.0.0'"
              if ($LASTEXITCODE -ne 0) { throw "Native installed version check failed" }
              & $Python -m am_spd reproduce-paper --cases synthetic_geometry --strict-reference --output-dir (Join-Path $env:RUNNER_TEMP "am-spd-native-windows-replay")
              if ($LASTEXITCODE -ne 0) { throw "Native installed paper replay failed" }
              Write-Host "Windows CPython 3.13 offline installation and full verification passed."
          } finally {
              Pop-Location
          }

  release:
    needs: [gate, build, windows_offline]
    if: >-
      needs.gate.result == 'success' &&
      needs.build.result == 'success' &&
      needs.windows_offline.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Download the qualified distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.distributions }}
          path: release-assets/distributions
          merge-multiple: true
      - name: Download the natively qualified Windows offline ZIP
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.windows_bundle }}
          path: release-assets/windows
          merge-multiple: true
      - name: Publish once, preserving existing tag and release identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_MAIN_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repository = os.environ["GH_REPO"]
          tested_sha = os.environ["TESTED_MAIN_SHA"]
          tag = "am-spd-v1.0.0"

          def api(endpoint, missing_ok=False):
              result = subprocess.run(["gh", "api", endpoint], text=True, capture_output=True)
              if result.returncode:
                  if missing_ok and "HTTP 404" in result.stderr:
                      return None
                  raise SystemExit(result.stderr)
              return json.loads(result.stdout)

          def require_current_main():
              if api(f"repos/{repository}/branches/main")["commit"]["sha"] != tested_sha:
                  raise SystemExit("Main advanced after qualification; release requires CI and assets for the new SHA")

          require_current_main()
          reference = api(f"repos/{repository}/git/ref/tags/{tag}", missing_ok=True)
          if reference is not None:
              target = reference["object"]
              for _ in range(16):
                  if target["type"] == "commit":
                      break
                  if target["type"] != "tag":
                      raise SystemExit("The existing release tag does not resolve to a commit")
                  target = api(f"repos/{repository}/git/tags/{target['sha']}")["object"]
              else:
                  raise SystemExit("The existing tag has excessive annotation depth")
              if target["sha"] != tested_sha:
                  raise SystemExit("The existing tag points to a different commit; it will not be moved")
          existing = api(f"repos/{repository}/releases/tags/{tag}", missing_ok=True)
          if existing is not None:
              if reference is None:
                  raise SystemExit("An existing release has no resolvable matching tag")
              require_current_main()
              print(f"Release {tag} already exists at the tested main SHA; no changes made.")
              raise SystemExit(0)

          distributions = Path("release-assets/distributions")
          wheel = list(distributions.glob("komorebi_am_spd-1.0.0-*.whl"))
          source = list(distributions.glob("komorebi_am_spd-1.0.0.tar.gz"))
          archive = Path("release-assets/windows/komorebi-am-spd-1.0.0-windows-cp313.zip")
          if len(wheel) != 1 or len(source) != 1 or not archive.is_file():
              raise SystemExit("All three qualified release assets are required")
          command = [
              "gh", "release", "create", tag, "--repo", repository,
              "--target", tested_sha, "--title", "AM-SPD 1.0.0",
              "--notes-file", "packages/komorebi-am-spd/RELEASE_NOTES_v1.0.0.md",
          ]
          if reference is not None:
              command.append("--verify-tag")
          command.extend(str(path) for path in (wheel[0], source[0], archive))
          require_current_main()
          subprocess.run(command, check=True)
          print(f"Released {tag} from qualified main {tested_sha}.")
          PY

name: Constructive Repair qualified beta
on:
  push:
    branches: [main]
    paths:
      - 'packages/constructive-repair/**'
      - 'publication/constructive-repair/**'
      - 'tools/constructive_repair_release.py'
      - 'tools/test_constructive_repair_release.py'
      - '.github/workflows/constructive-repair-release.yml'
      - 'LICENSE.md'
      - 'LICENSE-CODE.txt'
  pull_request:
    paths:
      - 'packages/constructive-repair/**'
      - 'publication/constructive-repair/**'
      - 'tools/constructive_repair_release.py'
      - 'tools/test_constructive_repair_release.py'
      - '.github/workflows/constructive-repair-release.yml'
      - 'LICENSE.md'
      - 'LICENSE-CODE.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: constructive-repair-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  qualify:
    name: Qualify ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-24.04
            python: '3.13.5'
          - id: windows
            os: windows-2025
            python: '3.13.5'
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes and allow long paths
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            packages/constructive-repair
            manifests/source-imports
            publication/constructive-repair
            tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned build tools
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: setuptools==84.1.0 wheel==0.48.0
      - name: Check distribution gate rejection controls
        run: python -B -m unittest discover -s tools -p 'test_constructive_repair_release.py' -v
      - name: Build and qualify the exact distribution
        env:
          QUALIFY_DIR: ${{ runner.temp }}/constructive-repair-${{ matrix.id }}
        run: python -B tools/constructive_repair_release.py qualify --root "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" --output "$QUALIFY_DIR"
      - name: Preserve qualified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: constructive-repair-qualified-${{ matrix.id }}
          path: ${{ runner.temp }}/constructive-repair-${{ matrix.id }}/artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: constructive-repair-diagnostics-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/constructive-repair-${{ matrix.id }}/qualification.json
            ${{ runner.temp }}/constructive-repair-${{ matrix.id }}/build-wheel.log
            ${{ runner.temp }}/constructive-repair-${{ matrix.id }}/acceptance.log
            ${{ runner.temp }}/constructive-repair-${{ matrix.id }}/raw-acceptance/*.json
            ${{ runner.temp }}/constructive-repair-${{ matrix.id }}/raw-acceptance/*.log
            ${{ runner.temp }}/constructive-repair-${{ matrix.id }}/raw-acceptance/platform_acceptance/*.json
            ${{ runner.temp }}/constructive-repair-${{ matrix.id }}/raw-acceptance/platform_acceptance/*.log
          if-no-files-found: ignore
          retention-days: 30
  publish:
    name: Verify and publish qualified beta
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.5'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: constructive-repair-qualified-*
          path: release-inputs
      - name: Verify both archives and bind the same accepted wheel
        env:
          RELEASE_DIR: ${{ runner.temp }}/constructive-repair-release
        run: python -B tools/constructive_repair_release.py assemble --inputs release-inputs --output "$RELEASE_DIR" --revision "$GITHUB_SHA"
      - name: Publish a new prerelease without replacing older artifacts
        env:
          RELEASE_DIR: ${{ runner.temp }}/constructive-repair-release
        shell: bash
        run: |
          tag="constructive-repair-1.0.0rc3-qualified-${GITHUB_SHA:0:12}"
          gh release create "$tag" "$RELEASE_DIR"/assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Constructive Repair 1.0.0rc3 — qualified beta" --notes-file "$RELEASE_DIR/release-notes.md"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

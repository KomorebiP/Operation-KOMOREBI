name: Exact verification

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full active and historical verification on Linux
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quick:
    name: Quick checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/verify.py --quick
      - run: git diff --exit-code

  full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: g++ --version
      - run: python scripts/verify.py --all
      - run: git diff --exit-code

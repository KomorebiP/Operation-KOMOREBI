name: Proof Path Theory

on:
  push:
    paths:
      - "proof-path-theory/**"
      - ".github/workflows/proof-path-theory-ci.yml"
  pull_request:
    paths:
      - "proof-path-theory/**"
      - ".github/workflows/proof-path-theory-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: proof-path-theory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: proof-path-theory/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest
      - run: python scripts/build_examples.py
      - run: sudo apt-get update && sudo apt-get install -y fonts-lato
      - run: python scripts/generate_figures.py
      # Hosted CI runs the finite software checks, not a fresh Lean audit.
      # Full formal verification requires the separately supplied pinned runtime.
      - run: python scripts/deep_validation.py
      - run: python scripts/build_bridge_examples.py
      - run: python scripts/verify_bridge.py
      - run: python scripts/check_recovery_extension.py

  package:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proof-path-theory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: proof-path-theory/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[release]"
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: proof-path-theory-distributions
          path: proof-path-theory/dist/*

  paper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proof-path-theory
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra lmodern
      - run: cd docs && pdflatex -interaction=nonstopmode -halt-on-error Proof_Path_Theory.tex
      - run: cd docs && pdflatex -interaction=nonstopmode -halt-on-error Proof_Path_Theory.tex
      - run: cd docs && pdflatex -interaction=nonstopmode -halt-on-error Proof_Path_Theory.tex
      - uses: actions/upload-artifact@v4
        with:
          name: proof-path-theory-paper
          path: proof-path-theory/docs/Proof_Path_Theory.pdf

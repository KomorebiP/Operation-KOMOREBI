   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #403348" x="23.730034" y="93.555624" transform="rotate(-0 23.730034 93.555624)">Packet error</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #302d34" transform="translate(23.730034 111.965887)">Split the packet</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #302d34" transform="translate(23.730034 123.951916)">or raise its order</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9d742d" x="131.216904" y="93.555624" transform="rotate(-0 131.216904 93.555624)">Support / alias</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #302d34" transform="translate(131.216904 111.965887)">Extend the</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #302d34" transform="translate(131.216904 123.951916)">support endpoint</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9d742d" x="238.703774" y="93.555624" transform="rotate(-0 238.703774 93.555624)">Omitted modes</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #302d34" transform="translate(238.703774 111.965887)">Retain more</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #302d34" transform="translate(238.703774 123.951916)">cosine modes</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #34777a" x="346.190645" y="93.555624" transform="rotate(-0 346.190645 93.555624)">Arithmetic width</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #302d34" transform="translate(346.190645 111.965887)">Raise directed</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #302d34" transform="translate(346.190645 123.951916)">precision</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #403348" x="229.32" y="191.762025" transform="rotate(-0 229.32 191.762025)">Combine justified errors, then test the resulting enclosure</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 7.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #34777a" x="16.0524" y="13.156491" transform="rotate(-0 16.0524 13.156491)">DECLARED VISUAL STUDY</text>

  <g id="text_11">
   <text style="font-weight: 500; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #403348" x="16.0524" y="32.402925" transform="rotate(-0 16.0524 32.402925)">Refine the cause of uncertainty, not just a total</text>
  </g>
  <g id="text_12">
   <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #706d75" x="16.0524" y="214.593844" transform="rotate(-0 16.0524 214.593844)">The exact-spectrum interval path omits packet approximation; arithmetic width is a separate obligation.</text>

name: Mathematical or Lean issue
description: Report a statement, hypothesis, proof, or theorem-correspondence problem.
title: "[Mathematics] "
body:
  - type: input
    id: reference
    attributes:
      label: Statement or Lean declaration
      description: Give the proposition number, section, or fully qualified declaration name.
    validations:
      required: true
  - type: textarea
    id: concern
    attributes:
      label: Precise concern
      description: State the problematic implication and retain the relevant hypotheses.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting argument or smallest reproducer
      description: Include a counterexample, missing step, Lean command, or exact diagnostic as appropriate.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Release or commit
      placeholder: "v1.0.0 or a commit SHA"

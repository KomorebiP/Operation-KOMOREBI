name: Reproduction or packaging issue
description: Report a download, dependency, build, or verification problem.
title: "[Reproduction] "
body:
  - type: input
    id: revision
    attributes:
      label: Release or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and command
      description: Include operating system, Lean version and the exact command you ran.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output
      description: Include the first failure and enough surrounding output to identify the stage.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result

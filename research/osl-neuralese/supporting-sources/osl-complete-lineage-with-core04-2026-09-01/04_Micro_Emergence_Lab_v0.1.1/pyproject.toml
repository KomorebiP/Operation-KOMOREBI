[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osl-micro-emergence-lab"
version = "0.1.1"
description = "Offline falsification-first lab for Micro OSL operator-language emergence"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.3"]

[project.optional-dependencies]
neural = ["torch>=2.2", "matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["osl_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

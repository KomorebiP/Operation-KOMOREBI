[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-neuralese-operator-workspace"
version = "0.3.0"
description = "Hard-stable recurrent operator, closure, and causal transport assays"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "torch>=2.6", "matplotlib>=3.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

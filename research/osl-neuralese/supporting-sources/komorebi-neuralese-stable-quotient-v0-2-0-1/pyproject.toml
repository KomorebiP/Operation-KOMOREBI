[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-neuralese-stable-quotient"
version = "0.2.0"
description = "Projective recurrent latent-operator stability, closure, and transport assay"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "torch>=2.6", "matplotlib>=3.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-neuralese-g1"
version = "0.1.1"
description = "Causal pilot for recurrent latent depth in a frozen transformer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.4,<3", "transformers>=4.45,<6"]

[tool.setuptools.packages.find]
include = ["neuralese_g1*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-neuralese-ambient-packets"
version = "0.3.0"
description = "Ambient continuation packets, gauge decomposition, and switched projective stability assay"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "torch>=2.6", "matplotlib>=3.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

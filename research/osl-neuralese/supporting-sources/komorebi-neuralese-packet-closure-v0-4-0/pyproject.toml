[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-neuralese-packet-closure"
version = "0.4.0"
description = "Hard-polar ambient packet-closure training and causal audit"
authors = [{ name = "Komorebi P." }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "torch>=2.6", "matplotlib>=3.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

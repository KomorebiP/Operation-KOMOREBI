[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-recurrent-depth-lab"
version = "0.1.1"
description = "Finite-profiled tests for recurrent latent dynamics and Komorebi lane transport"
requires-python = ">=3.11"
authors = [{name = "Komorebi P."}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
huginn = ["torch>=2.5", "transformers==4.57.6", "accelerate>=1.0,<2"]
quant = ["bitsandbytes>=0.45"]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

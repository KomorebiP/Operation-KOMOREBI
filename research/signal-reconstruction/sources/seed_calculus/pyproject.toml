[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-seven-area-proof-atlas"
version = "2.0.0"
description = "Complete seed-to-reconstruction derivation with seven detailed exact worked realizations"
requires-python = ">=3.10"
dependencies = ["sympy>=1.13", "numpy>=2.0", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["proof_atlas"]

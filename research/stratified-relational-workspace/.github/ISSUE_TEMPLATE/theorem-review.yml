name: Theorem or proof review
description: Report a proof gap, missing hypothesis, counterexample, or theorem-scope concern.
title: "[Theorem review] "
labels: [mathematics, review]
body:
  - type: input
    id: statement
    attributes:
      label: Statement identifier
      description: Give the theorem name, source label, PDF page, or statement-index number.
      placeholder: "Example: thm:laplacian-kernel, PDF p. 24"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Concern type
      options:
        - False statement or counterexample
        - Missing hypothesis
        - Proof gap
        - Bound or constant
        - Notation or definition conflict
        - Novelty or precedence classification
        - Other
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Exact claim under review
      description: Quote or restate the smallest relevant claim.
    validations:
      required: true
  - type: textarea
    id: analysis
    attributes:
      label: Analysis
      description: Explain the issue and include a derivation, citation, or reproducible counterexample when available.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: State the smallest correction or additional hypothesis that would resolve the issue.

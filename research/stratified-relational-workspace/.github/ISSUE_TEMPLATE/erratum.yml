name: Erratum report
description: Report a confirmed or suspected textual, equation, citation, or cross-reference error.
title: "[Erratum] "
labels: [erratum]
body:
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: "PDF page, source file, line, topic, or label"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text or equation
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Mathematical impact
      description: State whether the issue is typographical, local, or affects downstream results.

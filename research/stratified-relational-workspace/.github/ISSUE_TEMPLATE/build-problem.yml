name: Build or verification problem
description: Report a reproducible LaTeX, Python, CI, packaging, or PDF-audit failure.
title: "[Build] "
labels: [build, reproducibility]
body:
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "OS, TeX Live version, Python version"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction steps
    validations:
      required: true

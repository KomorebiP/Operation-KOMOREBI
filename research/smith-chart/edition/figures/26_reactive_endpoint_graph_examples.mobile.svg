<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1650" viewBox="0 0 440 1650" role="img" aria-labelledby="title desc"><title id="title">Necessary capacitor-voltage endpoint test</title><desc id="desc">Both graphs have inductors on 02, 03, 04. The rejected graph has capacitors on those same pairs; the other has capacitors on 02, 03, 14. Resistors are omitted from this reactive placement test.</desc><style>text{font-family: Arial, Helvetica, sans-serif;font-variant-numeric:tabular-nums}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" text-anchor="start" style="font-size:21px;font-weight:700;fill:#126f61">DC ENDPOINT FILTER</text><text x="24" y="77" text-anchor="start" style="font-size:29px;font-weight:650;fill:#183831">Capacitor voltage</text><text x="24" y="114" text-anchor="start" style="font-size:29px;font-weight:650;fill:#183831">must survive the L short.</text><text x="24" y="158" text-anchor="start" style="font-size:21px;font-weight:700;fill:#a63c48">REJECTED BY THIS FILTER</text><g transform="translate(0,168)"><g data-component="L_02" data-kind="L" data-endpoints="0,2"><g transform="translate(52,102) rotate(90.0)"><path d="M0,0 L79.0,0" fill="none" stroke="#126f61" stroke-width="2.6"/><path d="M129.0,0 L208.0,0" fill="none" stroke="#126f61" stroke-width="2.6"/><path d="M79.0,0 a6.25,10 0 0 1 12.5,0 a6.25,10 0 0 1 12.5,0 a6.25,10 0 0 1 12.5,0 a6.25,10 0 0 1 12.5,0" fill="none" stroke="#126f61" stroke-width="2.8"/></g></g><path d="M75,102 L52,102" fill="none" stroke="#183831" stroke-width="2.6"/><path d="M52,310 L52,370" fill="none" stroke="#183831" stroke-width="2.6"/><g data-component="C_02" data-kind="C" data-endpoints="0,2"><g transform="translate(98,102) rotate(90.0)"><path d="M0,0 L79.0,0" fill="none" stroke="#315f99" stroke-width="2.6"/><path d="M129.0,0 L208.0,0" fill="none" stroke="#315f99" stroke-width="2.6"/><path d="M79.0,0 L98.0,0" fill="none" stroke="#315f9
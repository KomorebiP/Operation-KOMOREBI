<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1430" viewBox="0 0 440 1430" role="img" aria-labelledby="title desc"><title id="title">Three-reactive passive circuit</title><desc id="desc">Series connection of the indicated parallel component groups. Component symbols and normalized values are listed explicitly.</desc><style>text{font-family: Arial, Helvetica, sans-serif;font-variant-numeric:tabular-nums}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" text-anchor="start" style="font-size:21px;font-weight:700;fill:#126f61">TRANSFORMER-FREE REALIZATION</text><text x="24" y="77" text-anchor="start" style="font-size:29px;font-weight:650;fill:#183831">Three-reactive passive circuit</text><text x="220" y="127" text-anchor="middle" style="font-size:25px;font-weight:650;fill:#183831">+</text><path d="M220,151 L125,151" fill="none" stroke="#183831" stroke-width="2.6"/><path d="M125,344 L220,344" fill="none" stroke="#183831" stroke-width="2.6"/><g data-component="r₁" data-kind="R" data-endpoints="input,A"><g transform="translate(125,151) rotate(90.0)"><path d="M0,0 L71.5,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><path d="M121.5,0 L193.0,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><rect x="71.5" y="-9" width="50" height="18" fill="white" stroke="#4c625b" stroke-width="2.6"/></g></g><text x="98" y="255" text-anchor="end" style="font-size:24px;font-weight:400;fill:#183831">r₁</text><path d="M220,151 L315,151" fill="none" stroke="#183831" stroke-width="2.6"/><path d="M315,344 L220,344" fill="none" stroke="#183831" stroke-width="2.6"/><g data-component="ℓ₁" data-kind="L" data-endpoints="input,A"><g transform="translate(315,151) rotate(90.0)"><path d="M0,0 L71.5,0" fill="none" stroke="#126f61" stroke-width="2.6"/><path d="M121.5,0 L193.0,0" fill="none" stroke="#126f61" stroke-width="2.6"/><path d="M71.5,0 a6.25,10 0 0 1 12.5,0 a6.25,10 0 0 1 12.5,0 a6.25,10 0 0 1 12.5,0
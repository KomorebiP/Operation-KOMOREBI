<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="516" viewBox="0 0 1000 516" role="img" aria-labelledby="title desc"><title id="title">Status of the three pole-pair sections</title><desc id="desc">The real and lower complex pole-pair sections have exact two-reactive circuits. The upper complex section is positive-real and nonregular, with no realization established in this decomposition.</desc><style>text{font-family: Arial, Helvetica, sans-serif;font-variant-numeric:tabular-nums}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="36" y="36" text-anchor="start" style="font-size:16px;font-weight:700;fill:#126f61">SERIES POLE-PAIR EXTRACTION</text><text x="36" y="77" text-anchor="start" style="font-size:30px;font-weight:650;fill:#183831">Two realized sections. One unresolved section.</text><rect x="36" y="142" width="286" height="230" rx="8" fill="#edf5f1" stroke="#dbe5e0"/><text x="56" y="177" text-anchor="start" style="font-size:17px;font-weight:700;fill:#126f61">01 · REALIZED</text><text x="56" y="225" text-anchor="start" style="font-size:24px;font-weight:650;fill:#183831">Real pole pair</text><text x="56" y="279" text-anchor="start" style="font-size:20px;font-weight:400;fill:#183831">1 inductor + 1 capacitor</text><text x="56" y="321" text-anchor="start" style="font-size:20px;font-weight:400;fill:#183831">3 positive resistors</text><text x="340" y="266" text-anchor="middle" style="font-size:30px;font-weight:400;fill:#4c625b">+</text><rect x="357" y="142" width="286" height="230" rx="8" fill="#edf5f1" stroke="#dbe5e0"/><text x="377" y="177" text-anchor="start" style="font-size:17px;font-weight:700;fill:#126f61">02 · REALIZED</text><text x="377" y="225" text-anchor="start" style="font-size:24px;font-weight:650;fill:#183831">Lower complex pair</text><text x="377" y="279" text-anchor="start" style="font-size:20px;font-weight:400;fill:#183831">1 inductor + 1 capacitor</text><text x="377" y="321" text-anchor="start" style="font-size:20px;font-weight:400;fill:#183831">3 positive resistors</text><text x="661" y="266" text-anchor="middle" style="font-size:30px;font-weight:400;fill:#4c625b">+</text><rect x="678" y="142" width="286" height="230" rx="8" fill="#fbf0f1" stroke="#dbe5e0"/><text x="698" y="177" text-anchor="start" style="font-size:17px;font-weight:700;fill:#a63c48">03 · UNRESOLVED</text><text x="698" y="225" text-anchor="start" style="font-size:24px;font-weight:650;fill:#183831">Upper complex pair</text><text x="698" y="279" text-anchor="start" style="font-size:20px;font-weight:400;fill:#183831">Positive-real, nonregular</text><text x="698" y="321" text-anchor="start" style="font-size:20px;font-weight:400;fill:#183831">No realization established</text><text x="36" y="434" text-anchor="start" style="font-size:25px;font-weight:600;fill:#183831">A positive-real residual does not supply the missing circuit.</text><text x="36" y="479" text-anchor="start" style="font-size:22px;font-weight:400;fill:#4c625b">The complete six-reactive transformer-free realization remains unresolved.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Exact five-node placement census</title><desc id="desc">14400 labelled placements, 3249 without port shorts, 2500 without same-type cycles, 1934 with both endpoint signs possible; 168 symmetry classes. These are graph counts, not a feasibility proof.</desc><style>text{font-family: Arial, Helvetica, sans-serif;fill:#183831}.muted{fill:#62736c}.title{font-size:26px;font-weight:600}.label{font-size:19px}.small{font-size:16px}.kicker{font-size:14px;font-weight:700;letter-spacing:1.7px}</style><rect width="100%" height="100%" fill="white"/><text x="42" y="42" class="kicker" >FIVE-NODE REACTIVE PLACEMENTS</text><text x="42" y="84" class="title" >Graph restrictions reduce the finite catalogue</text><text x="42" y="157" class="small" >All labelled placements</text><rect x="325" y="137" width="510.0" height="30" rx="3" fill="#396c9c" opacity="0.55"/><text x="855.0" y="158" class="small" >14,400</text><text x="42" y="231" class="small" >No reactive-only port short</text><rect x="325" y="211" width="115.06875" height="30" rx="3" fill="#396c9c" opacity="0.7000000000000001"/><text x="460.06875" y="232" class="small" >3,249</text><text x="42" y="305" class="small" >No same-type reactive cycle</text><rect x="325" y="285" width="88.54166666666666" height="30" rx="3" fill="#396c9c" opacity="0.8500000000000001"/><text x="433.54166666666663" y="306" class="small" >2,500</text><text x="42" y="379" class="small" >Both endpoint signs possible</text><rect x="325" y="359" width="68.49583333333334" height="30" rx="3" fill="#167467" opacity="1.0"/><text x="413.49583333333334" y="380" class="small" >1,934</text><line x1="42" y1="431" x2="958" y2="431" stroke="#d8e4de" stroke-width="2" /><text x="42" y="467" class="label" fill="#167467">168 symmetry classes</text><text x="380" y="467" class="small" >after internal relabelling and terminal exchange</text><text x="42" y="507" class="small" >A placement passing these filters still requires positive component values and an exact circuit identity.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Physical storage and observable degree</title><desc id="desc">Two passive sections in series use seven reactive elements. A common linear factor reduces section B to degree three.</desc><style>text{font-family: Arial, Helvetica, sans-serif;fill:#183831}.muted{fill:#62736c}.title{font-size:26px;font-weight:600}.label{font-size:19px}.small{font-size:16px}.kicker{font-size:14px;font-weight:700;letter-spacing:1.7px}</style><rect width="100%" height="100%" fill="white"/><text x="42" y="42" class="kicker" >EXACT SYNTHESIS</text><text x="42" y="86" class="title" >Seven storage elements; degree six at the port</text><rect x="42" y="124" width="420" height="172" rx="10" fill="#eef5f2" stroke="#d8e4de"/><rect x="42" y="124" width="5" height="172" rx="2" fill="#167467"/><text x="66" y="159" class="kicker" >Section A</text><text x="66" y="199" class="label" >2 inductors + 1 capacitor</text><text x="66" y="232" class="small" >4 positive resistors</text><text x="66" y="270" class="small" fill="#167467">Reduced input degree 3</text><rect x="538" y="124" width="420" height="172" rx="10" fill="#eef5f2" stroke="#d8e4de"/><rect x="538" y="124" width="5" height="172" rx="2" fill="#396c9c"/><text x="562" y="159" class="kicker" >Section B</text><text x="562" y="199" class="label" >2 inductors + 2 capacitors</text><text x="562" y="232" class="small" >10 positive resistors</text><text x="562" y="270" class="small" fill="#396c9c">Reduced input degree 3</text><line x1="464" y1="210" x2="536" y2="210" stroke="#167467" stroke-width="2" /><text x="500" y="197" class="small" text-anchor="middle">series</text><rect x="42" y="332" width="916" height="108" rx="8" fill="#f7f8fa" stroke="#d8e4de"/><text x="64" y="365" class="kicker" >ONE COMMON FACTOR IN SECTION B</text><text x="64" y="402" class="label" >N(s) = H(s) T(s)       D(s) = H(s) B(s)</text><text x="630" y="365" class="kicker" >PHYSICAL COUNT</text><text x="630" y="402" class="label" >3 + 4 = 7</text><text x="808" y="365" class="kicker" >PORT DEGREE</text><text x="808" y="402" class="label" >3 + 3 = 6</text><text x="42" y="477" class="small" >The canceled factor hides one internal mode. All seven reactive components remain.</text></svg>

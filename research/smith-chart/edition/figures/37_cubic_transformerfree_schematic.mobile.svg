<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1120" viewBox="0 0 440 1120" role="img" aria-labelledby="title desc"><title id="title">Exact cubic extraction component graph</title><desc id="desc">Resistors on 02, 03, 12, 23; inductors on 03, 12; capacitor on 13. A planar layout and separated parallel branches make every connection explicit.</desc><style>text{font-family: Arial, Helvetica, sans-serif;font-variant-numeric:tabular-nums}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" text-anchor="start" style="font-size:21px;font-weight:700;fill:#126f61">CERTIFIED CUBIC CIRCUIT</text><text x="24" y="77" text-anchor="start" style="font-size:29px;font-weight:650;fill:#183831">Three reactive elements.</text><text x="24" y="114" text-anchor="start" style="font-size:29px;font-weight:650;fill:#183831">Seven components in total.</text><g transform="translate(0,135)"><g data-component="R₀₂" data-kind="R" data-endpoints="0,2"><g transform="translate(55,253) rotate(-41.89114320369874)"><path d="M0,0 L85.82531299301617,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><path d="M135.82531299301615,0 L221.65062598603234,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><rect x="85.82531299301617" y="-9" width="50" height="18" fill="white" stroke="#4c625b" stroke-width="2.6"/></g></g><text x="108" y="153" text-anchor="middle" style="font-size:23px;font-weight:400;fill:#183831">R₀₂</text><g data-component="R₀₃" data-kind="R" data-endpoints="0,3"><g transform="translate(55,253) rotate(41.89114320369874)"><path d="M0,0 L85.82531299301617,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><path d="M135.82531299301615,0 L221.65062598603234,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><rect x="85.82531299301617" y="-9" width="50" height="18" fill="white" stroke="#4c625b" stroke-width="2.6"/></g></g><text x="153" y="310" text-anchor="middle" style="font-size:23px;font-weight:400;fill
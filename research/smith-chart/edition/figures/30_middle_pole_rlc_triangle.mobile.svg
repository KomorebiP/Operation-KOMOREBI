<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1000" viewBox="0 0 440 1000" role="img" aria-labelledby="title desc"><title id="title">The complex-pole-pair circuit</title><desc id="desc">An explicitly connected three-node circuit, with one inductor, one capacitor and three resistors. Parallel branches are separated and normalized component values are listed.</desc><style>text{font-family: Arial, Helvetica, sans-serif;font-variant-numeric:tabular-nums}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" text-anchor="start" style="font-size:21px;font-weight:700;fill:#126f61">THREE RESISTORS · ONE L · ONE C</text><text x="24" y="77" text-anchor="start" style="font-size:29px;font-weight:650;fill:#183831">Complex-pole-pair circuit</text><g transform="translate(0,80)"><g data-component="R_A" data-kind="R" data-endpoints="1,2"><g transform="translate(80,142) rotate(0.0)"><path d="M0,0 L105.0,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><path d="M155.0,0 L260.0,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><rect x="105.0" y="-9" width="50" height="18" fill="white" stroke="#4c625b" stroke-width="2.6"/></g></g><text x="210" y="114" text-anchor="middle" style="font-size:24px;font-weight:400;fill:#183831">R<tspan baseline-shift="sub" font-size="75%">A</tspan></text><path d="M80,142 L45,142" fill="none" stroke="#183831" stroke-width="2.6"/><g data-component="R_G" data-kind="R" data-endpoints="1,0"><g transform="translate(45,142) rotate(90.0)"><path d="M0,0 L150.0,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><path d="M200.0,0 L350.0,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><rect x="150.0" y="-9" width="50" height="18" fill="white" stroke="#4c625b" stroke-width="2.6"/></g></g><text x="80" y="302" text-anchor="start" style="font-size:24px;font-weight:400;fill:#183831">R<tspan baseline-shift="sub" font-size="75%">G</tspan></text><path d="M80,142 L145,142" fill="none" stroke="#183831" stroke-width="2.6"/><g data-component="C" data-kind="C" data-endpoints="1,0"><g transform="translate(145,142) rotate(90.0)"><path d="M0,0 L150.0,0" fill="none" stroke="#315f99" stroke-width="2.6"/><path d="M200.0,0 L350.0,0" fill="none" stroke="#315f99" stroke-width="2.6"/><path d="M150.0,0 L169.0,0" fill="none" stroke="#315f99" stroke-width="2.6"/><path d="M181.0,0 L200.0,0" fill="none" stroke="#315f99" stroke-width="2.6"/><path d="M169.0,-19 L169.0,19" fill="none" stroke="#315f99" stroke-width="3"/><path d="M181.0,-19 L181.0,19" fill="none" stroke="#315f99" stroke-width="3"/></g></g><text x="174" y="353" text-anchor="start" style="font-size:24px;font-weight:400;fill:#183831">C</text><path d="M340,142 L285,142" fill="none" stroke="#183831" stroke-width="2.6"/><g data-component="R_B" data-kind="R" data-endpoints="2,0"><g transform="translate(285,142) rotate(90.0)"><path d="M0,0 L150.0,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><path d="M200.0,0 L350.0,0" fill="none" stroke="#4c625b" stroke-width="2.6"/><rect x="150.0" y="-9" width="50" height="18" fill="white" stroke="#4c625b" stroke-width="2.6"/></g></g><text x="320" y="302" text-anchor="start" style="font-size:24px;font-weight:400;fill:#183831">R<tspan baseline-shift="sub" font-size="75%">B</tspan></text><path d="M340,142 L385,142" fill="none" stroke="#183831" stroke-width="2.6"/><g data-component="L" data-kind="L" data-endpoints="2,0"><g transform="translate(385,142) rotate(90.0)"><path d="M0,0 L150.0,0" fill="none" stroke="#126f61" stroke-width="2.6"/><path d="M200.0,0 L350.0,0" fill="none" stroke="#126f61" stroke-width="2.6"/><path d="M150.0,0 a6.25,10 0 0 1 12.5,0 a6.25,10 0 0 1 12.5,0 a6.25,10 0 0 1 12.5,0 a6.25,10 0 0 1 12.5,0" fill="none" stroke="#126f61" stroke-width="2.8"/></g></g><text x="408" y="353" text-anchor="start" style="font-size:24px;font-weight:400;fill:#183831">L</text><path d="M45,492 L385,492" fill="none" stroke="#183831" stroke-width="2.6"/><g data-node="1" data-x="80" data-y="142"><circle cx="80" cy="142" r="19" fill="white" stroke="#183831" stroke-width="2.4"/><text x="80" y="149" text-anchor="middle" style="font-size:22px;font-weight:650;fill:#183831">1</text></g><g data-node="2" data-x="340" data-y="142"><circle cx="340" cy="142" r="17" fill="white" stroke="#183831" stroke-width="2.4"/><text x="340" y="149" text-anchor="middle" style="font-size:22px;font-weight:650;fill:#183831">2</text></g><g data-node="0" data-x="220" data-y="492"><circle cx="220" cy="492" r="17" fill="white" stroke="#183831" stroke-width="2.4"/><text x="220" y="499" text-anchor="middle" style="font-size:22px;font-weight:650;fill:#183831">0</text></g></g><text x="24" y="632" text-anchor="start" style="font-size:24px;font-weight:600;fill:#183831">Normalized values</text><path d="M24,662 L416,662" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="28" y="694" text-anchor="start" style="font-size:24px;font-weight:600;fill:#183831">R<tspan baseline-shift="sub" font-size="75%">G</tspan></text><text x="412" y="694" text-anchor="end" style="font-size:24px;font-weight:400;fill:#183831">1</text><path d="M24,710 L416,710" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="28" y="742" text-anchor="start" style="font-size:24px;font-weight:600;fill:#183831">R<tspan baseline-shift="sub" font-size="75%">A</tspan></text><text x="412" y="742" text-anchor="end" style="font-size:24px;font-weight:400;fill:#183831">≈ 0.09556</text><path d="M24,758 L416,758" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="28" y="790" text-anchor="start" style="font-size:24px;font-weight:600;fill:#183831">R<tspan baseline-shift="sub" font-size="75%">B</tspan></text><text x="412" y="790" text-anchor="end" style="font-size:24px;font-weight:400;fill:#183831">≈ 0.05027</text><path d="M24,806 L416,806" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="28" y="838" text-anchor="start" style="font-size:24px;font-weight:600;fill:#183831">L</text><text x="412" y="838" text-anchor="end" style="font-size:24px;font-weight:400;fill:#183831">≈ 0.075328</text><path d="M24,854 L416,854" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="28" y="886" text-anchor="start" style="font-size:24px;font-weight:600;fill:#183831">C</text><text x="412" y="886" text-anchor="end" style="font-size:24px;font-weight:400;fill:#183831">≈ 9.50264</text><text x="24" y="942" text-anchor="start" style="font-size:22px;font-weight:400;fill:#4c625b">1: input · 0: return</text><text x="24" y="974" text-anchor="start" style="font-size:21px;font-weight:400;fill:#4c625b">Decimal labels are rounded.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Pairwise feasibility does not imply joint Pick feasibility</title><desc id="desc">Three distinct edges represent positive two-node principal minors. The full three-node Pick determinant is negative. Exact values are shown for the all-positive coupling branch.</desc><style>text{font-family: Arial, Helvetica, sans-serif;font-variant-numeric:tabular-nums}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="36" y="36" text-anchor="start" style="font-size:16px;font-weight:700;fill:#126f61">GLOBAL PICK COMPATIBILITY</text><text x="36" y="77" text-anchor="start" style="font-size:30px;font-weight:650;fill:#183831">Pairwise tests pass. The joint test fails.</text><g data-pair="1,2"><path d="M246,164 L82,402" fill="none" stroke="#126f61" stroke-width="3.4"/></g><rect x="109" y="261" width="78" height="40" rx="20" fill="#edf5f1" stroke="#c3d9ce"/><text x="148" y="289" text-anchor="middle" style="font-size:24px;font-weight:650;fill:#126f61">1–2</text><g data-pair="1,3"><path d="M246,164 L410,402" fill="none" stroke="#126f61" stroke-width="3.4"/></g><rect x="305" y="261" width="78" height="40" rx="20" fill="#edf5f1" stroke="#c3d9ce"/><text x="344" y="289" text-anchor="middle" style="font-size:24px;font-weight:650;fill:#126f61">1–3</text><g data-pair="2,3"><path d="M82,402 L410,402" fill="none" stroke="#126f61" stroke-width="3.4"/></g><rect x="207" y="382" width="78" height="40" rx="20" fill="#edf5f1" stroke="#c3d9ce"/><text x="246" y="410" text-anchor="middle" style="font-size:24px;font-weight:650;fill:#126f61">2–3</text><g data-node="1" data-x="246" data-y="164"><circle cx="246" cy="164" r="23" fill="#126f61"/><text x="246" y="173" text-anchor="middle" style="font-size:27px;font-weight:650;fill:white">1</text></g><g data-node="2" data-x="82" data-y="402"><circle cx="82" cy="402" r="23" fill="#126f61"/><text x="82" y="411" text-anchor="middle" style="font-size:27px;font-weight:650;fill:white">2</text></g><g data-node="3" data-x="410" data-y="402"><circle cx="410" cy="402" r="23" fill="#126f61"/><text x="410" y="411" text-anchor="middle" style="font-size:27px;font-weight:650;fill:white">3</text></g><text x="246" y="465" text-anchor="middle" style="font-size:25px;font-weight:600;fill:#126f61">Every pair is feasible</text><text x="246" y="497" text-anchor="middle" style="font-size:20px;font-weight:400;fill:#4c625b">Nodes: measured frequencies s = 1, 2, 3</text><text x="526" y="137" text-anchor="start" style="font-size:18px;font-weight:700;fill:#126f61">PAIRWISE PRINCIPAL MINORS</text><path d="M526,164 L958,164" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="542" y="199" text-anchor="start" style="font-size:25px;font-weight:650;fill:#183831">1–2</text><text x="806" y="175" text-anchor="middle" style="font-size:24px;font-weight:400;fill:#126f61">12397</text><path d="M746.92,184 L865.08,184" fill="none" stroke="#126f61" stroke-width="1.3"/><text x="806" y="215" text-anchor="middle" style="font-size:24px;font-weight:400;fill:#126f61">1036800</text><path d="M526,237 L958,237" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="542" y="272" text-anchor="start" style="font-size:25px;font-weight:650;fill:#183831">1–3</text><text x="806" y="248" text-anchor="middle" style="font-size:24px;font-weight:400;fill:#126f61">53067</text><path d="M746.92,257 L865.08,257" fill="none" stroke="#126f61" stroke-width="1.3"/><text x="806" y="288" text-anchor="middle" style="font-size:24px;font-weight:400;fill:#126f61">2560000</text><path d="M526,310 L958,310" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="542" y="345" text-anchor="start" style="font-size:25px;font-weight:650;fill:#183831">2–3</text><text x="806" y="321" text-anchor="middle" style="font-size:24px;font-weight:400;fill:#126f61">343</text><path d="M754.36,330 L857.64,330" fill="none" stroke="#126f61" stroke-width="1.3"/><text x="806" y="361" text-anchor="middle" style="font-size:24px;font-weight:400;fill:#126f61">320000</text><rect x="510" y="400" width="454" height="142" rx="8" fill="#fbf0f1" stroke="#e5c6ca"/><text x="737" y="431" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#a63c48">FULL 3 × 3 DETERMINANT &lt; 0</text><text x="737" y="473" text-anchor="middle" style="font-size:26px;font-weight:400;fill:#a63c48">−3981887</text><path d="M641.34,482 L832.66,482" fill="none" stroke="#a63c48" stroke-width="1.3"/><text x="737" y="515" text-anchor="middle" style="font-size:26px;font-weight:400;fill:#a63c48">82944000000</text><text x="36" y="587" text-anchor="start" style="font-size:23px;font-weight:600;fill:#183831">No single passive interpolation fits all three measurements.</text><text x="36" y="622" text-anchor="start" style="font-size:19px;font-weight:400;fill:#4c625b">The displayed determinants use the all-positive coupling branch.</text></svg>

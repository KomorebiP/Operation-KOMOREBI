<svg xmlns="http://www.w3.org/2000/svg" width="580" height="735" viewBox="0 0 580 735" role="img" aria-labelledby="title desc"><title id="title">Physical storage and observable degree, stacked layout</title><desc id="desc">The two passive sections are in series. Section A has three reactive elements and section B has four. A common factor reduces section B to degree three.</desc><style>text{font-family: Arial, Helvetica, sans-serif;fill:#183831}.muted{fill:#62736c}.title{font-size:26px;font-weight:600}.label{font-size:19px}.small{font-size:16px}.kicker{font-size:14px;font-weight:700;letter-spacing:1.7px}</style><rect width="100%" height="100%" fill="white"/><text x="32" y="38" class="kicker" >EXACT SYNTHESIS</text><text x="32" y="77" class="title" >Seven elements; degree six</text><rect x="32" y="112" width="516" height="170" rx="8" fill="#eef5f2" stroke="#d8e4de"/><text x="54" y="147" class="kicker" >SECTION A</text><text x="54" y="188" class="label" >2 inductors + 1 capacitor</text><text x="54" y="223" class="label" >4 positive resistors</text><text x="54" y="260" class="label" >Reduced input degree 3</text><rect x="32" y="327" width="516" height="170" rx="8" fill="#eef5f2" stroke="#d8e4de"/><text x="54" y="362" class="kicker" >SECTION B</text><text x="54" y="403" class="label" >2 inductors + 2 capacitors</text><text x="54" y="438" class="label" >10 positive resistors</text><text x="54" y="475" class="label" >Reduced input degree 3</text><line x1="290" y1="284" x2="290" y2="324" stroke="#167467" stroke-width="2" /><text x="311" y="312" class="small" >series</text><text x="32" y="551" class="label" >One common factor in section B</text><text x="32" y="591" class="label" >Physical count: 3 + 4 = 7</text><text x="32" y="626" class="label" >Port degree: 3 + 3 = 6</text><text x="32" y="677" class="small" >Cancellation hides an internal mode.</text><text x="32" y="704" class="small" >All seven reactive components remain.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1104" viewBox="0 0 400 1104" role="img" aria-labelledby="title desc"><title id="title">Pairwise feasibility does not imply joint Pick feasibility</title><desc id="desc">Three distinct edges represent positive two-node principal minors. The full three-node Pick determinant is negative. Exact values are shown for the all-positive coupling branch.</desc><style>text{font-family: Arial, Helvetica, sans-serif;font-variant-numeric:tabular-nums}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" text-anchor="start" style="font-size:21px;font-weight:700;fill:#126f61">GLOBAL PICK COMPATIBILITY</text><text x="24" y="77" text-anchor="start" style="font-size:29px;font-weight:650;fill:#183831">Three passing pairs.</text><text x="24" y="114" text-anchor="start" style="font-size:29px;font-weight:650;fill:#183831">One incompatible triple.</text><g data-pair="1,2"><path d="M200,185 L62,384" fill="none" stroke="#126f61" stroke-width="3.4"/></g><rect x="77" y="265" width="78" height="40" rx="20" fill="#edf5f1" stroke="#c3d9ce"/><text x="116" y="293" text-anchor="middle" style="font-size:24px;font-weight:650;fill:#126f61">1–2</text><g data-pair="1,3"><path d="M200,185 L338,384" fill="none" stroke="#126f61" stroke-width="3.4"/></g><rect x="245" y="265" width="78" height="40" rx="20" fill="#edf5f1" stroke="#c3d9ce"/><text x="284" y="293" text-anchor="middle" style="font-size:24px;font-weight:650;fill:#126f61">1–3</text><g data-pair="2,3"><path d="M62,384 L338,384" fill="none" stroke="#126f61" stroke-width="3.4"/></g><rect x="161" y="364" width="78" height="40" rx="20" fill="#edf5f1" stroke="#c3d9ce"/><text x="200" y="392" text-anchor="middle" style="font-size:24px;font-weight:650;fill:#126f61">2–3</text><g data-node="1" data-x="200" data-y="185"><circle cx="200" cy="185" r="23" fill="#126f61"/><text x="200" y="194" text-anchor="middle" style="font-size:27px;font-weight:650;fill:white">1</text></g><g data-node="2" data-x="62" data-y="384"><circle cx="62" cy="384" r="23" fill="#126f61"/><text x="62" y="393" text-anchor="middle" style="font-size:27px;font-weight:650;fill:white">2</text></g><g data-node="3" data-x="338" data-y="384"><circle cx="338" cy="384" r="23" fill="#126f61"/><text x="338" y="393" text-anchor="middle" style="font-size:27px;font-weight:650;fill:white">3</text></g><text x="200" y="443" text-anchor="middle" style="font-size:22px;font-weight:400;fill:#4c625b">Measured frequencies: s = 1, 2, 3</text><text x="24" y="496" text-anchor="start" style="font-size:20px;font-weight:700;fill:#126f61">PAIR TESTS · ALL POSITIVE</text><path d="M24,515 L376,515" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="32" y="553" text-anchor="start" style="font-size:26px;font-weight:650;fill:#183831">1–2</text><text x="252" y="530" text-anchor="middle" style="font-size:25px;font-weight:400;fill:#126f61">12397</text><path d="M190.75,539 L313.25,539" fill="none" stroke="#126f61" stroke-width="1.3"/><text x="252" y="571" text-anchor="middle" style="font-size:25px;font-weight:400;fill:#126f61">1036800</text><path d="M24,595 L376,595" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="32" y="633" text-anchor="start" style="font-size:26px;font-weight:650;fill:#183831">1–3</text><text x="252" y="610" text-anchor="middle" style="font-size:25px;font-weight:400;fill:#126f61">53067</text><path d="M190.75,619 L313.25,619" fill="none" stroke="#126f61" stroke-width="1.3"/><text x="252" y="651" text-anchor="middle" style="font-size:25px;font-weight:400;fill:#126f61">2560000</text><path d="M24,675 L376,675" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="32" y="713" text-anchor="start" style="font-size:26px;font-weight:650;fill:#183831">2–3</text><text x="252" y="690" text-anchor="middle" style="font-size:25px;font-weight:400;fill:#126f61">343</text><path d="M198.5,699 L305.5,699" fill="none" stroke="#126f61" stroke-width="1.3"/><text x="252" y="731" text-anchor="middle" style="font-size:25px;font-weight:400;fill:#126f61">320000</text><rect x="24" y="783" width="352" height="176" rx="8" fill="#fbf0f1" stroke="#e5c6ca"/><text x="200" y="818" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#a63c48">JOINT TEST · NEGATIVE</text><text x="200" y="864" text-anchor="middle" style="font-size:28px;font-weight:400;fill:#a63c48">−3981887</text><path d="M97.52,873 L302.48,873" fill="none" stroke="#a63c48" stroke-width="1.3"/><text x="200" y="908" text-anchor="middle" style="font-size:28px;font-weight:400;fill:#a63c48">82944000000</text><text x="24" y="1003" text-anchor="start" style="font-size:23px;font-weight:600;fill:#183831">No single passive interpolation</text><text x="24" y="1034" text-anchor="start" style="font-size:23px;font-weight:600;fill:#183831">fits the complete triple.</text><text x="24" y="1080" text-anchor="start" style="font-size:20px;font-weight:400;fill:#4c625b">Shown: positive coupling branch.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1085" viewBox="0 0 440 1085" role="img" aria-labelledby="title desc"><title id="title">Status of the three pole-pair sections</title><desc id="desc">The real and lower complex pole-pair sections have exact two-reactive circuits. The upper complex section is positive-real and nonregular, with no realization established in this decomposition.</desc><style>text{font-family: Arial, Helvetica, sans-serif;font-variant-numeric:tabular-nums}path,polyline{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="36" text-anchor="start" style="font-size:21px;font-weight:700;fill:#126f61">SERIES POLE-PAIR EXTRACTION</text><text x="24" y="77" text-anchor="start" style="font-size:29px;font-weight:650;fill:#183831">Two realized sections.</text><text x="24" y="114" text-anchor="start" style="font-size:29px;font-weight:650;fill:#183831">One unresolved section.</text><rect x="24" y="155" width="392" height="230" rx="8" fill="#edf5f1" stroke="#dbe5e0"/><text x="44" y="190" text-anchor="start" style="font-size:21px;font-weight:700;fill:#126f61">01 · REALIZED</text><text x="44" y="238" text-anchor="start" style="font-size:26px;font-weight:650;fill:#183831">Real pole pair</text><text x="44" y="292" text-anchor="start" style="font-size:24px;font-weight:400;fill:#183831">1 inductor + 1 capacitor</text><text x="44" y="334" text-anchor="start" style="font-size:24px;font-weight:400;fill:#183831">3 positive resistors</text><text x="220" y="418" text-anchor="middle" style="font-size:30px;font-weight:400;fill:#4c625b">+</text><rect x="24" y="429" width="392" height="230" rx="8" fill="#edf5f1" stroke="#dbe5e0"/><text x="44" y="464" text-anchor="start" style="font-size:21px;font-weight:700;fill:#126f61">02 · REALIZED</text><text x="44" y="512" text-anchor="start" style="font-size:26px;font-weight:650;fill:#183831">Lower complex pair</text><text x="44" y="566" text-anchor="start" style="font-size:24px;font-weight:400;fill:#183831">1 inductor + 1 capacitor</text><text x="44" y="608" text-anchor="start" style="font-size:24px;font-weight:400;fill:#183831">3 positive resistors</text><text x="220" y="692" text-anchor="middle" style="font-size:30px;font-weight:400;fill:#4c625b">+</text><rect x="24" y="703" width="392" height="230" rx="8" fill="#fbf0f1" stroke="#dbe5e0"/><text x="44" y="738" text-anchor="start" style="font-size:21px;font-weight:700;fill:#a63c48">03 · UNRESOLVED</text><text x="44" y="786" text-anchor="start" style="font-size:26px;font-weight:650;fill:#183831">Upper complex pair</text><text x="44" y="840" text-anchor="start" style="font-size:24px;font-weight:400;fill:#183831">Positive-real, nonregular</text><text x="44" y="882" text-anchor="start" style="font-size:24px;font-weight:400;fill:#183831">No realization established</text><text x="24" y="1021" text-anchor="start" style="font-size:23px;font-weight:600;fill:#183831">A six-reactive transformer-free</text><text x="24" y="1054" text-anchor="start" style="font-size:23px;font-weight:600;fill:#183831">realization remains unresolved.</text></svg>

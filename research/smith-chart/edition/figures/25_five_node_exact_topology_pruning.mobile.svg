<svg xmlns="http://www.w3.org/2000/svg" width="600" height="635" viewBox="0 0 600 635" role="img" aria-labelledby="title desc"><title id="title">Five-node placement census, stacked layout</title><desc id="desc">Four labelled-placement counts lead to 1934 survivors, then 168 symmetry classes. Passing the filters does not prove electrical feasibility.</desc><style>text{font-family: Arial, Helvetica, sans-serif;fill:#183831}.muted{fill:#62736c}.title{font-size:26px;font-weight:600}.label{font-size:19px}.small{font-size:16px}.kicker{font-size:14px;font-weight:700;letter-spacing:1.7px}</style><rect width="100%" height="100%" fill="white"/><text x="32" y="38" class="kicker" >FIVE-NODE PLACEMENTS</text><text x="32" y="78" class="title" >The finite graph catalogue</text><text x="32" y="126" class="label" >All labelled placements</text><rect x="32" y="143" width="440.0" height="27" rx="3" fill="#396c9c"/><text x="488.0" y="165" class="small" >14,400</text><text x="32" y="220" class="label" >No reactive-only port short</text><rect x="32" y="237" width="99.27499999999999" height="27" rx="3" fill="#396c9c"/><text x="147.27499999999998" y="259" class="small" >3,249</text><text x="32" y="314" class="label" >No same-type reactive cycle</text><rect x="32" y="331" width="76.38888888888889" height="27" rx="3" fill="#396c9c"/><text x="124.38888888888889" y="353" class="small" >2,500</text><text x="32" y="408" class="label" >Both endpoint signs possible</text><rect x="32" y="425" width="59.09444444444445" height="27" rx="3" fill="#167467"/><text x="107.09444444444445" y="447" class="small" >1,934</text><line x1="32" y1="517" x2="568" y2="517" stroke="#d8e4de" stroke-width="2" /><text x="32" y="560" class="title" >168 symmetry classes</text><text x="32" y="597" class="small" >Component feasibility still requires an exact solution.</text></svg>

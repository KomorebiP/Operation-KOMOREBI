   <g id="text_1">
    <text style="font-weight: 700; font-size: 18px; font-family: Arial, Helvetica, sans-serif; text-anchor: start; fill: #152c47" x="24.12" y="36.057019" transform="rotate(-0 24.12 36.057019)">CONJUGATE-ROTATION RESPONSE  ·  FOUR REACTIVE ELEMENTS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: Arial, Helvetica, sans-serif; text-anchor: start; fill: #506476" x="24.12" y="56.337329" transform="rotate(-0 24.12 56.337329)">The exact H one-port consists of a parallel LC tank followed by a resistor across a series RLC branch.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: Arial, Helvetica, sans-serif; text-anchor: start; fill: #152c47" x="38.07" y="95.771265" transform="rotate(-0 38.07 95.771265)">Port +</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #506476" x="122.328" y="98.587974" transform="rotate(-0 122.328 98.587974)">Lₜ = 48/35</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #506476" x="155.808" y="207.87631" transform="rotate(-0 155.808 207.87631)">Cₜ = 35/48</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #27649a" x="171.99" y="253.507006" transform="rotate(-0 171.99 253.507006)">Lossless parallel LC tank</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #506476" x="502.605" y="100.841342" transform="rotate(-0 502.605 100.841342)">Rₚ = 1</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #506476" x="382.635" y="207.87631" transform="rotate(-0 382.635 207.87631)">Rₛ = 25/24</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #506476" x="477.495" y="205.622942" transform="rotate(-0 477.495 205.622942)">Lₛ = 35/48</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #506476" x="580.725" y="207.87631" transform="rotate(-0 580.725 207.87631)">Cₛ = 48/35</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10px; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #d18424" x="545.85" y="253.507006" transform="rotate(-0 545.85 253.507006)">Dissipative parallel R / series RLC block</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: Arial, Helvetica, sans-serif; text-anchor: end; fill: #152c47" x="819.27" y="96.334606" transform="rotate(-0 819.27 96.334606)">Port −</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: Arial, Helvetica, sans-serif; text-anchor: start; fill: #152c47" x="32.49" y="308.714516" transform="rotate(-0 32.49 308.714516)">z_H(s) = 1 + 48s/[35(s²+1)] − 48s/[7(5s²+14s+5)]</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: Arial, Helvetica, sans-serif; text-anchor: start; fill: #506476" x="32.49" y="335.191587" transform="rotate(-0 32.49 335.191587)">Normalized to Z₀; all values are exact positive rationals. The first LC branch is a parallel resonator.</text>
   </g>

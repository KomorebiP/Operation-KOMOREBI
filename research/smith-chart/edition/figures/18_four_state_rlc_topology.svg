ize:22px;font-weight:400;fill:#183831">Rₚ  1</text><text x="769" y="508" text-anchor="start" style="font-size:22px;font-weight:400;fill:#183831">Rₛ  25 / 24</text><text x="40" y="554" text-anchor="start" style="font-size:22px;font-weight:400;fill:#183831">Lₛ  35 / 48</text><text x="283" y="554" text-anchor="start" style="font-size:22px;font-weight:400;fill:#183831">Cₛ  48 / 35</text><path d="M36,470 L964,470" fill="none" stroke="#dbe5e0" stroke-width="1"/><text x="36" y="607" text-anchor="start" style="font-size:23px;font-weight:400;fill:#183831">z<tspan baseline-shift="sub" font-size="75%">H</tspan>(s) = 1 + 48s/[35(s²+1)] − 48s/[7(5s²+14s+5)]</text><text x="36" y="649" text-anchor="start" style="font-size:20px;font-weight:400;fill:#4c625b">Normalized to Z₀. All component values are exact positive rationals.</text></svg>

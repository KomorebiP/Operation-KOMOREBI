<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1260" viewBox="0 0 360 1260" role="img" aria-labelledby="title desc">
<title id="title">Uniform physical transfer through resistor faces</title>
<desc id="desc">Resistor-only elimination retains at most ten vertices and forty-five resistor slots. A maximum-conductance spanning forest has at most nine edges. An empty scale band permits small total-budget opening and contraction while leaving a bounded resistor backbone. A tiny natural driven denominator yields a nearby physical internal mode; a regular denominator yields a repaired zero-loss driven state and a global near-target core chart. The written bound is error greater than ten to the negative power ten to the forty-fifth. It is an extremely small structural bound; a practical global margin, independent review and full formal verification remain open.</desc>
<style>text{font-family:Arial,sans-serif;fill:#16362f}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:19px}.small{font-size:15px}.bound{font-size:27px;font-weight:700}.card{fill:#f4f8f4;stroke:#739686;stroke-width:2}.arrow{fill:none;stroke:#416959;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="360" height="1260" rx="15" fill="#fcfdfb"/>
<text x="20" y="35" class="head" text-anchor="start">Uniform physical transfer</text>
<text x="20" y="65" class="small" text-anchor="start">Positive-real Laplace samples</text>
<rect class="card" x="20" y="90" width="320" height="125" rx="12"/>
<text x="36" y="122" class="body" text-anchor="start">1. Keep every LC endpoint</text>
<text x="36" y="156" class="small" text-anchor="start">Eliminate only R-only vertices.</text>
<text x="36" y="190" class="small" text-anchor="start">At most 10 vertices and 45 R slots.</text>
<path class="arrow" d="M180 218 L180 242"/><path class="arrow" d="M175 234 L180 242 L185 234"/>
<rect class="card" x="20" y="250" width="320" height="145" rx="12"/>
<text x="36" y="282" class="body" text-anchor="start">2. Choose an R backbone</text>
<text x="36" y="316" class="small" text-anchor="start">At most 9 spanning-forest edges.</text>
<text x="36" y="347" class="small" text-anchor="start">A gap controls weak cuts and</text>
<text x="36" y="375" class="small" text-anchor="start">strong tree-edge contractions.</text>
<path class="arrow" d="M180 398 L180 422"/><path class="arrow" d="M175 414 L180 422 L185 414"/>
<rect class="card" x="20" y="430" width="320" height="110" rx="12"/>
<text x="36" y="463" class="body" text-anchor="start">3. Repair actual LC flows</text>
<text x="36" y="499" class="small" text-anchor="start">KCL holds at every original node.</text>
<path class="arrow" d="M180 543 L180 565"/><path class="arrow" d="M175 557 L180 565 L185 557"/>
<rect class="card" x="20" y="575" width="320" height="145" rx="12"/>
<text x="36" y="608" class="body" text-anchor="start">Small source denominator</text>
<text x="36" y="643" class="small" text-anchor="start">Construct a physical internal mode.</text>
<text x="36" y="678" class="small" text-anchor="start">Exact-mode error &gt; 10⁻¹³.</text>
<text x="180" y="737" class="small" text-anchor="middle">or</text>
<rect class="card" x="20" y="745" width="320" height="165" rx="12"/>
<text x="36" y="778" class="body" text-anchor="start">Regular source denominator</text>
<text x="36" y="813" class="small" text-anchor="start">Construct a zero-loss driven state.</text>
<text x="36" y="848" class="small" text-anchor="start">Near-target feature chart:</text>
<text x="36" y="884" class="body" text-anchor="start">sample error &gt; 1/300.</text>
<path class="arrow" d="M180 914 L180 938"/><path class="arrow" d="M175 930 L180 938 L185 930"/>
<rect class="card" x="20" y="950" width="320" height="155" rx="12"/>
<text x="36" y="985" class="body" text-anchor="start">Uniform structural conclusion</text>
<text x="36" y="1025" class="bound" text-anchor="start">E &gt; 10⁻ᴺ,  N = 10⁴⁵</text>
<text x="36" y="1067" class="small" text-anchor="start">All ordinary circuits with ≤ 4 LC.</text>
<rect class="card" x="20" y="1130" width="320" height="110" rx="12"/>
<text x="36" y="1164" class="small" text-anchor="start">Extremely small global bound.</text>
<text x="36" y="1194" class="small" text-anchor="start">State certificates give larger bounds.</text>
<text x="36" y="1224" class="small" text-anchor="start">Physical graph proof and exact checks.</text>
</svg>

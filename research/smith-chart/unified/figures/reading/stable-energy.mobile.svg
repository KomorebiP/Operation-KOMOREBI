<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1420" viewBox="0 0 360 1420" role="img" aria-labelledby="title desc">
<title id="title">Physical constraints on near-target Smith/RLC circuits</title>
<desc id="desc">Natural graph stability cuts the coefficient quadrilateral to a triangle. Root constraints, energy, endpoints and positive-real rounding give whole one-L and one-C margins at budgets three and four, with arbitrary resistors and no endpoint or resonant guard. Coverage is 1334 of 2130. The 796 balanced two-L/two-C placements remain. The tiny structural bounds are not hardware tolerances.</desc>
<style>text{font-family:Arial,sans-serif;fill:#16362f}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.card{fill:#f4f8f4;stroke:#739686;stroke-width:2}</style>
<rect width="360" height="1420" rx="15" fill="#fcfdfb"/>
<style>.head{font-size:19px}</style>
<text x="20" y="36" class="title">Physical constraints</text>
<text x="20" y="68" class="head">on near-target circuits</text>
<rect x="20" y="90" width="320" height="390" rx="12" class="card"/>
<text x="36" y="122" class="head">Graph stability cuts the fiber</text>
<polygon points="287.00000,405.00000 214.69231,296.53846 52.00000,170.00000" fill="#fff0d2" stroke="#b18a43" stroke-width="2"/><polygon points="52.00000,405.00000 287.00000,405.00000 52.00000,170.00000" fill="#dcefe5" stroke="#3e7564" stroke-width="2"/><circle cx="169.50000" cy="287.50000" r="5" fill="#a34c40"/><text x="47" y="430" class="small">b only</text><text x="250" y="430" class="small">a only</text><text x="45" y="158" class="small">c only</text><text x="106" y="375" class="small">stable triangle</text><text x="178" y="281" class="small">m(i) = 0</text>
<text x="36" y="457" class="small">a, b, c ≥ 0; a + b + c = 1/30</text>
<rect x="20" y="500" width="320" height="225" rx="12" class="card"/>
<text x="36" y="535" class="head">Whole three-reactive margins</text>
<text x="36" y="570" class="body">One L: error &gt; 10⁻¹¹</text>
<text x="36" y="600" class="small">One C: error &gt; 10⁻¹³</text>
<text x="36" y="640" class="body">Every placement; arbitrary R.</text>
<text x="36" y="670" class="small">No endpoint or resonance guard.</text>
<text x="36" y="700" class="small">Positive-real samples only.</text>
<rect x="20" y="745" width="320" height="195" rx="12" class="card"/>
<text x="36" y="780" class="head">Whole four-reactive margins</text>
<text x="36" y="814" class="body">One L: error &gt; 10⁻³⁰</text>
<text x="36" y="846" class="small">One C: error &gt; 10⁻³⁷</text>
<text x="36" y="873" class="small">Arbitrary resistor count/values.</text>
<text x="36" y="911" class="small">Tiny structural separation bounds.</text>
<rect x="20" y="960" width="320" height="220" rx="12" class="card"/>
<text x="36" y="995" class="head">Every fit at error ≤ 10⁻⁷:</text>
<text x="36" y="1030" class="small">3 reactives: all values bounded.</text>
<text x="36" y="1060" class="small">4 reactives: at least 3 bounded.</text>
<text x="36" y="1092" class="small">Normalized interval [10⁻⁷, 10⁷].</text>
<text x="36" y="1124" class="small">R values remain unbounded.</text>
<text x="36" y="1155" class="small">Positive-real samples only.</text>
<rect x="20" y="1200" width="320" height="185" rx="12" class="card"/>
<text x="36" y="1236" class="head">Balanced class constraints</text>
<text x="36" y="1271" class="body">796 two-L/two-C placements.</text>
<text x="36" y="1303" class="small">One-L/C classes: 1,334 / 2,130.</text>
<text x="36" y="1333" class="small">Selected Lean statements: 41.</text>
<text x="36" y="1363" class="small">Written self-review + exact replay.</text>
</svg>

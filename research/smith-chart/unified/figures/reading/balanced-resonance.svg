<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="750" viewBox="0 0 1050 750" role="img" aria-labelledby="title desc">
<title id="title">Balanced resonance: exact obstruction and a certified neighborhood</title>
<desc id="desc">A representative four-reactive internal mode has zero voltage at both ports and equal internal mode voltages. The two-terminal bridge is inversion symmetric. All internal-mode balanced graphs either reduce to at most three reactives or have that symmetry. An explicitly certified region with at most one-percent detuning and total opened-resistor conductance at most one hundredth has sample error greater than three fortieths. Positive-real Laplace samples only. The 796 whole balanced placements remain open.</desc>
<style>text{font-family:Arial,sans-serif;fill:#16362f}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.card{fill:#f4f8f4;stroke:#739686;stroke-width:2}.wire{fill:none;stroke:#16362f;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1050" height="750" rx="15" fill="#fcfdfb"/>
<text x="30" y="45" class="title" text-anchor="start">Balanced resonance: an exact obstruction and a certified region</text>
<rect x="25" y="80" width="520" height="495" rx="12" class="card"/>
<text x="48" y="119" class="head" text-anchor="start">Representative internal mode</text>
<g transform="translate(90 320) rotate(-37.568592)" class="wire"><path d="M0 0 H93.0091 M153.0091 0 H246.0183"/><path d="M93.0091 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 "/></g><g transform="translate(285 170) rotate(37.568592)" class="wire"><path d="M0 0 H93.0091 M153.0091 0 H246.0183"/><path d="M93.0091 0 H115.0091 M131.0091 0 H153.0091 M115.0091 -15 V15 M131.0091 -15 V15"/></g><g transform="translate(90 320) rotate(37.568592)" class="wire"><path d="M0 0 H93.0091 M153.0091 0 H246.0183"/><path d="M93.0091 0 H115.0091 M131.0091 0 H153.0091 M115.0091 -15 V15 M131.0091 -15 V15"/></g><g transform="translate(285 470) rotate(-37.568592)" class="wire"><path d="M0 0 H93.0091 M153.0091 0 H246.0183"/><path d="M93.0091 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 "/></g><g transform="translate(285 170) rotate(90.000000)" class="wire"><path d="M0 0 H120.0000 M180.0000 0 H300.0000"/><path d="M120.0000 0 l5 -10 10 20 10 -20 10 20 10 -20 10 20 5 -10"/></g><circle cx="90" cy="320" r="5" fill="#16362f"/><circle cx="480" cy="320" r="5" fill="#16362f"/><circle cx="285" cy="170" r="5" fill="#16362f"/><circle cx="285" cy="470" r="5" fill="#16362f"/><text x="160" y="228" class="small" text-anchor="middle">L = ℓ</text><text x="414" y="228" class="small" text-anchor="middle">C = 1/ℓ</text><text x="160" y="428" class="small" text-anchor="middle">C = 1/ℓ</text><text x="414" y="428" class="small" text-anchor="middle">L = ℓ</text><text x="342" y="327" class="small" text-anchor="middle">r</text><text x="90" y="357" class="small" text-anchor="middle">w = 0</text><text x="480" y="357" class="small" text-anchor="middle">w = 0</text><text x="285" y="144" class="small" text-anchor="middle">w = 1</text><text x="285" y="505" class="small" text-anchor="middle">w = 1</text><text x="76" y="305" class="small" text-anchor="middle">1</text><text x="494" y="305" class="small" text-anchor="middle">0</text>
<text x="48" y="548" class="small" text-anchor="start">r represents any internal two-terminal resistor network.</text>
<rect x="570" y="80" width="455" height="225" rx="12" class="card"/>
<text x="593" y="119" class="head" text-anchor="start">Exact-mode dichotomy</text>
<text x="593" y="158" class="body" text-anchor="start">At most 3 reactives, or Γ(s) = Γ(1/s).</text>
<text x="593" y="198" class="small" text-anchor="start">Native P(i) = Q(i) = 0 gives error &gt; 10⁻¹³.</text>
<text x="593" y="235" class="small" text-anchor="start">Symmetric branch: error ≥ 264/2627.</text>
<text x="593" y="274" class="small" text-anchor="start">w is a source-free mode, with both ports zero.</text>
<rect x="570" y="325" width="455" height="250" rx="12" class="card"/>
<text x="593" y="365" class="head" text-anchor="start">Certified neighborhood</text>
<text x="593" y="405" class="body" text-anchor="start">Reactive detuning ≤ 1%.</text>
<text x="593" y="443" class="small" text-anchor="start">Opened R conductance sum ≤ 1/100.</text>
<text x="593" y="484" class="body" text-anchor="start">Maximum sample error &gt; 3/40.</text>
<text x="593" y="522" class="small" text-anchor="start">Retained R count and values unrestricted.</text>
<text x="593" y="554" class="small" text-anchor="start">Positive-real Laplace samples only.</text>
<rect x="25" y="600" width="1000" height="115" rx="12" class="card"/>
<text x="48" y="641" class="head" text-anchor="start">The exact stratum and the displayed region are separated.</text>
<text x="48" y="675" class="small" text-anchor="start">The internal-mode and regular-core theorems cover distinct exact strata.</text>
<text x="48" y="702" class="small" text-anchor="start">The resistor-backbone argument connects sufficiently close fits to these strata.</text>
</svg>

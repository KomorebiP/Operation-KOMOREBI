ss="small" text-anchor="end">a</text><text x="306" y="176" class="small" text-anchor="start">b</text></g>
<text x="47" y="632" class="body" text-anchor="start">Exact sample error: 5175/65083</text>
<rect x="535" y="95" width="490" height="565" rx="12" class="card"/>
<text x="557" y="134" class="head" text-anchor="start">C: active parallel LC cycle</text>
<g transform="translate(550 150) scale(1.33)"><path class="wire" d="M22 180 V125 M112 180 V125"/><g transform="translate(22 125) rotate(0.000000)" class="wire"><path d="M0 0 H15.0000 M75.0000 0 H90.0000"/><path d="M15.0000 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 "/></g><text x="67.0" y="105" class="small" text-anchor="middle">L=1/2</text><path class="wire" d="M22 180 V235 M112 180 V235"/><g transform="translate(22 235) rotate(0.000000)" class="wire"><path d="M0 0 H15.0000 M75.0000 0 H90.0000"/><path d="M15.0000 0 H37.0000 M53.0000 0 H75.0000 M37.0000 -15 V15 M53.0000 -15 V15"/></g><text x="67.0" y="267" class="small" text-anchor="middle">C=1</text><g transform="translate(112 180) rotate(0.000000)" class="wire"><path d="M0 0 H15.0000 M75.0000 0 H90.0000"/><path d="M15.0000 0 H37.0000 M53.0000 0 H75.0000 M37.0000 -15 V15 M53.0000 -15 V15"/></g><text x="157.0" y="160" class="small" text-anchor="middle">C=1</text><g transform="translate(202 180) rotate(0.000000)" class="wire"><path d="M0 0 H15.0000 M75.0000 0 H90.0000"/><path d="M15.0000 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 "/></g><text x="247.0" y="160" class="small" text-anchor="middle">L=1</text><path class="wire" d="M22 180 V50 M202 180 V50"/><g transform="translate(22 50) rotate(0.000000)" class="wire"><path d="M0 0 H60.0000 M120.0000 0 H180.0000"/><path d="M60.0000 0 l5 -10 10 20 10 -20 10 20 10 -20 10 20 5 -10"/></g><text x="112.0" y="34" class="small" text-anchor="middle">R=4/5</text><path class="wire" d="M112 180 V305 M292 180 V305"/><g transform="translate(112 305) rotate(0.000000)" class="wire"><path d="M0 0 H60.0000 M120.0000 0 H180.0000"/><path d="M60.0000 0 l5 -10 10 20 10 -20 10 20 10 -20 10 20 5 -10"/></g><text x="202.0" y="330" class="small" text-anchor="middle">R=1</text><circle cx="22" cy="180" r="4" fill="#16362f"/><circle cx="112" cy="180" r="4" fill="#16362f"/><circle cx="202" cy="180" r="4" fill="#16362f"/><circ
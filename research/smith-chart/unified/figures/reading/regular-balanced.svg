<text x="557" y="632" class="body" text-anchor="start">Exact sample error: 25/2769</text>
<rect x="25" y="685" width="1000" height="210" rx="12" class="card"/>
<text x="48" y="725" class="head" text-anchor="start">One certified region around either supplied nominal response</text>
<text x="48" y="766" class="body" text-anchor="start">All retained physical R, L and C values: error ≤ 1%.</text>
<text x="48" y="805" class="small" text-anchor="start">Opened conductance + contracted resistance ≤ 1/10000.</text>
<text x="650" y="767" class="bound" text-anchor="start">Error &gt; 1/300.</text>
<text x="650" y="807" class="body" text-anchor="start">Positive-real samples.</text>
<text x="48" y="853" class="small" text-anchor="start">The exact classification includes disconnected active LC components and arbitrary resistor networks.</text>
<text x="48" y="879" class="small" text-anchor="start">The neighborhood uses explicit component and resistor-surgery budgets.</text>
<rect x="25" y="920" width="1000" height="80" rx="12" class="card"/>
<text x="48" y="953" class="small" text-anchor="start">Uniform transfer uses the resistor-backbone and flow-repair argument.</text>
<text x="48" y="983" class="small" text-anchor="start">Project self-review; selected Lean: 41. R labels are effective two-terminal resistances.</text>
</svg>

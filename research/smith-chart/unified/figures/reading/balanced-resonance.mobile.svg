<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1230" viewBox="0 0 360 1230" role="img" aria-labelledby="title desc">
<title id="title">Balanced resonance: exact obstruction and a certified neighborhood</title>
<desc id="desc">A representative four-reactive internal mode has zero voltage at both ports and equal internal mode voltages. The two-terminal bridge is inversion symmetric. All internal-mode balanced graphs either reduce to at most three reactives or have that symmetry. An explicitly certified region with at most one-percent detuning and total opened-resistor conductance at most one hundredth has sample error greater than three fortieths. Positive-real Laplace samples only. The 796 whole balanced placements remain open.</desc>
<style>text{font-family:Arial,sans-serif;fill:#16362f}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.card{fill:#f4f8f4;stroke:#739686;stroke-width:2}.wire{fill:none;stroke:#16362f;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="360" height="1230" rx="15" fill="#fcfdfb"/>
<text x="20" y="35" class="title" text-anchor="start">Balanced resonance</text>
<text x="20" y="67" class="small" text-anchor="start">Exact face + certified region</text>
<rect x="20" y="90" width="320" height="450" rx="12" class="card"/>
<text x="36" y="124" class="small" text-anchor="start">Representative internal mode</text>
<g transform="translate(50 320) rotate(-45.000000)" class="wire"><path d="M0 0 H61.9239 M121.9239 0 H183.8478"/><path d="M61.9239 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 "/></g><g transform="translate(180 190) rotate(45.000000)" class="wire"><path d="M0 0 H61.9239 M121.9239 0 H183.8478"/><path d="M61.9239 0 H83.9239 M99.9239 0 H121.9239 M83.9239 -15 V15 M99.9239 -15 V15"/></g><g transform="translate(50 320) rotate(45.000000)" class="wire"><path d="M0 0 H61.9239 M121.9239 0 H183.8478"/><path d="M61.9239 0 H83.9239 M99.9239 0 H121.9239 M83.9239 -15 V15 M99.9239 -15 V15"/></g><g transform="translate(180 450) rotate(-45.000000)" class="wire"><path d="M0 0 H61.9239 M121.9239 0 H183.8478"/><path d="M61.9239 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 a7.5 7.5 0 0 1 15 0 "/></g><g transform="translate(180 190) rotate(90.000000)" class="wire"><path d="M0 0 H100.0000 M160.0000 0 H260.0000"/><path d="M100.0000 0 l5 -10 10 20 10 -20 10 20 10 -20 10 20 5 -10"/></g><circle cx="50" cy="320" r="5" fill="#16362f"/><circle cx="310" cy="320" r="5" fill="#16362f"/><circle cx="180" cy="190" r="5" fill="#16362f"/><circle cx="180" cy="450" r="5" fill="#16362f"/><text x="95" y="240" class="small" text-anchor="middle">ℓ</text><text x="268" y="240" class="small" text-anchor="middle">1/ℓ</text><text x="95" y="418" class="small" text-anchor="middle">1/ℓ</text><text x="268" y="418" class="small" text-anchor="middle">ℓ</text><text x="225" y="326" class="small" text-anchor="middle">r</text><text x="50" y="354" class="small" text-anchor="middle">w = 0</text><text x="310" y="354" class="small" text-anchor="middle">w = 0</text><text x="180" y="166" class="small" text-anchor="middle">w = 1</text><text x="180" y="485" class="small" text-anchor="middle">w = 1</text><text x="36" y="305" class="small" text-anchor="middle">1</text><text x="324" y="305" class="small" text-anchor="middle">0</text>
<text x="36" y="520" class="small" text-anchor="start">r is an effective resistance.</text>
<rect x="20" y="560" width="320" height="235" rx="12" class="card"/>
<text x="36" y="597" class="head" text-anchor="start">Exact-mode dichotomy</text>
<text x="36" y="632" class="body" text-anchor="start">At most 3 reactives, or</text>
<text x="36" y="665" class="body" text-anchor="start">Γ(s) = Γ(1/s).</text>
<text x="36" y="704" class="small" text-anchor="start">Singular-face error &gt; 10⁻¹³.</text>
<text x="36" y="735" class="small" text-anchor="start">Symmetric branch: ≥ 264/2627.</text>
<text x="36" y="767" class="small" text-anchor="start">Mode ports both have w = 0.</text>
<rect x="20" y="815" width="320" height="220" rx="12" class="card"/>
<text x="36" y="852" class="head" text-anchor="start">Certified neighborhood</text>
<text x="36" y="886" class="small" text-anchor="start">Reactive detuning ≤ 1%.</text>
<text x="36" y="918" class="small" text-anchor="start">Opened R conductance ≤ 1/100.</text>
<text x="36" y="953" class="body" text-anchor="start">Sample error &gt; 3/40.</text>
<text x="36" y="988" class="small" text-anchor="start">Retained R values unrestricted.</text>
<text x="36" y="1018" class="small" text-anchor="start">Positive-real Laplace samples.</text>
<rect x="20" y="1055" width="320" height="150" rx="12" class="card"/>
<text x="36" y="1093" class="small" text-anchor="start">Uniform transfer theorem</text>
<text x="36" y="1128" class="body" text-anchor="start">Exact mode and regular strata.</text>
<text x="36" y="1162" class="small" text-anchor="start">Backbone transfer links both.</text>
<text x="36" y="1192" class="small" text-anchor="start">Written proof; selected Lean: 41.</text>
</svg>

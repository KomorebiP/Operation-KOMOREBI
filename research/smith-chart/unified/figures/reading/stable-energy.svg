<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="790" viewBox="0 0 1050 790" role="img" aria-labelledby="title desc">
<title id="title">Physical constraints on near-target Smith/RLC circuits</title>
<desc id="desc">Natural graph stability cuts the coefficient quadrilateral to a triangle. Root constraints, energy, endpoints and positive-real rounding give whole one-L and one-C margins at budgets three and four, with arbitrary resistors and no endpoint or resonant guard. Coverage is 1334 of 2130. The 796 balanced two-L/two-C placements remain. The tiny structural bounds are not hardware tolerances.</desc>
<style>text{font-family:Arial,sans-serif;fill:#16362f}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.card{fill:#f4f8f4;stroke:#739686;stroke-width:2}</style>
<rect width="1050" height="790" rx="15" fill="#fcfdfb"/>
<text x="35" y="47" class="title">Physical constraints for Smith/RLC separation</text>
<rect x="35" y="80" width="475" height="465" rx="12" class="card"/>
<text x="58" y="119" class="head">Graph stability cuts the coefficient fiber</text>
<polygon points="380.00000,460.00000 293.84615,330.76923 100.00000,180.00000" fill="#fff0d2" stroke="#b18a43" stroke-width="2"/><polygon points="100.00000,460.00000 380.00000,460.00000 100.00000,180.00000" fill="#dcefe5" stroke="#3e7564" stroke-width="2"/><circle cx="240.00000" cy="320.00000" r="5" fill="#a34c40"/><text x="95" y="485" class="small">b only</text><text x="343" y="485" class="small">a only</text><text x="93" y="168" class="small">c only</text><text x="164" y="430" class="small">stable triangle</text><text x="251" y="312" class="small">m(i) = 0</text>
<text x="280" y="195" class="small">Removed unstable factor</text>
<text x="58" y="520" class="small">Stable triangle: a, b, c ≥ 0; a + b + c = 1/30</text>
<rect x="535" y="80" width="480" height="225" rx="12" class="card"/>
<text x="558" y="119" class="head">Whole three-reactive margins</text>
<text x="558" y="160" class="body">One L: error &gt; 10⁻¹¹</text>
<text x="558" y="193" class="small">One C: error &gt; 10⁻¹³</text>
<text x="558" y="233" class="body">Every placement; arbitrary resistor count.</text>
<text x="558" y="270" class="small">No endpoint or resonant-denominator guard.</text>
<rect x="535" y="325" width="480" height="220" rx="12" class="card"/>
<text x="558" y="365" class="head">Whole four-reactive margins</text>
<text x="558" y="408" class="body">One L: error &gt; 10⁻³⁰</text>
<text x="558" y="445" class="body">One C: error &gt; 10⁻³⁷</text>
<text x="558" y="490" class="small">Each one-L/one-C class; arbitrary R.</text>
<text x="558" y="520" class="small">Tiny structural bounds; not hardware tolerances.</text>
<rect x="35" y="570" width="475" height="180" rx="12" class="card"/>
<text x="58" y="608" class="head">Every fit at error ≤ 10⁻⁷:</text>
<text x="58" y="643" class="small">3 reactives: all values lie in [10⁻⁷, 10⁷].</text>
<text x="58" y="675" class="small">4 reactives: at least three values lie there.</text>
<text x="58" y="707" class="small">Normalized L/C values; resistor values unbounded.</text>
<text x="58" y="735" class="small">Positive-real Laplace samples only.</text>
<rect x="535" y="570" width="480" height="180" rx="12" class="card"/>
<text x="558" y="608" class="head">Balanced response constraints</text>
<text x="558" y="643" class="small">796 two-L/two-C canonical placements.</text>
<text x="558" y="675" class="small">Selected Lean statements: 41.</text>
<text x="558" y="707" class="small">Physical constraints and exact algebraic checks.</text>
<text x="558" y="735" class="small">Positive-real comparison in the stated circuit model.</text>
</svg>

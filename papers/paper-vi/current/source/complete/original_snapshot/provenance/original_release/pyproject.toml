[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-transfer-semigroups"
version = "1.2.0"
description = "Projector-resolved Markov, Bayesian, fractional, PDE, and latent-state transfer models"
authors = [{name = "Komorebi P."}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["projector_transfer_semigroups"]

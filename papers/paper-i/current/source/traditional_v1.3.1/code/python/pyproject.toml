[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-seed-calculus"
version = "1.1.2"
description = "Finite and symbolic certificates for Projector-Resolved Seed Calculus I"
authors = [{name = "Komorebi P."}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "sympy>=1.12", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["seed_calculus"]

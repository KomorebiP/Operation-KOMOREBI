name = "KomorebiVerification"
version = "0.2.0"
keywords = ["math"]
defaultTargets = ["KomorebiVerification"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "KomorebiVerification"

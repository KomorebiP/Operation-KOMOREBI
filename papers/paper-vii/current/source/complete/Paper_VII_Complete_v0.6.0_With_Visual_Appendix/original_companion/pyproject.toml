[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-seed-quantum"
version = "1.0.0"
description = "Finite quantum packet models for Projector-Resolved Seed Calculus VII"
authors = [{name = "Komorebi P."}]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["projector_quantum_calculus"]

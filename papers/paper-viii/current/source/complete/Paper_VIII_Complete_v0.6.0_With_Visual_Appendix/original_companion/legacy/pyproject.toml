[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-packet-algorithms"
version = "1.0.0"
description = "Exact packet operators, complexity models, mixed-precision certificates, and CPU/GPU benchmark analysis"
authors = [{name = "Komorebi P."}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.1"]

[tool.setuptools]
packages = ["packet_gpu"]

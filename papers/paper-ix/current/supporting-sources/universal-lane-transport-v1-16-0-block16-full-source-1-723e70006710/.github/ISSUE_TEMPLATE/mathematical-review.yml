name: Mathematical review
description: Report a proof, typing, descent, scope, or prior-art concern
title: "[math-review] "
labels: ["mathematical review"]
body:
  - type: input
    id: label
    attributes:
      label: Theorem or section label
      placeholder: thm:block16-holonomy-twisted-lane-transport
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Review category
      options:
        - Proof gap
        - Missing hypothesis
        - Typing or domain issue
        - Descent or cocycle issue
        - Counterexample
        - Scope or claim boundary
        - Prior art or attribution
        - Exposition
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Exact statement under review
    validations:
      required: true
  - type: textarea
    id: analysis
    attributes:
      label: Reproducible analysis, derivation, or counterexample
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Review checks
      options:
        - label: I distinguished manuscript-level proof from external validation.
          required: true
        - label: I checked the printed hypotheses before reporting the issue.
          required: true
        - label: I distinguished object-address orbits from source-target pair orbits when relevant.
          required: false

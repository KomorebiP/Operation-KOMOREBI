name: Build or verification report
description: Report a reproducible build, CI, figure-generation, or verifier failure
title: "[build] "
labels: ["build"]
body:
  - type: input
    id: platform
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: tex
    attributes:
      label: TeX distribution and latexmk version
  - type: textarea
    id: command
    attributes:
      label: Exact command
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output or traceback
    validations:
      required: true

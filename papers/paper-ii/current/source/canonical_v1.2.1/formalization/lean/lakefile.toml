name = "KomorebiVerification"
version = "1.1.1"
description = "Kernel-checked Lean formalization for Projector-Resolved Seed Calculus II"
keywords = ["math"]
defaultTargets = ["KomorebiVerification"]
moreLeanArgs = ["-E", "warning"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "KomorebiVerification"

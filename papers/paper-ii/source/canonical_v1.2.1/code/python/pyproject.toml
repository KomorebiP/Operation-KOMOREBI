[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-seed-refinement"
version = "1.2.1"
description = "Nested packet refinement, weighted transfer, and dyadic-odd resolution"
authors = [{name = "Komorebi P."}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "sympy>=1.12", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["seed_refinement"]

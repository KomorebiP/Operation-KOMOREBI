[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-seed-signal"
version = "1.0.0"
description = "Polyphase signal, edge-packet, wavelet, and Smith-coordinate companion to Projector-Resolved Seed Calculus V"
authors = [{name = "Komorebi P."}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["projector_signal"]

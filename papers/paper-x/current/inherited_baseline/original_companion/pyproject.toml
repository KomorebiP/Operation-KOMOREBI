[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-seed-residuals"
version = "1.0.0"
description = "Exact finite models for residual seed forests, transport categories, companion completion, and finite occupancy"
authors = [{name = "Komorebi P."}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "sympy>=1.12", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["projector_seed_residuals"]
